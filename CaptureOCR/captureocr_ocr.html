<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OCR Local</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.4/tesseract.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0a0f1e;
      background-image: radial-gradient(at 0% 0%, rgba(249, 115, 22, 0.08) 0px, transparent 50%);
      color: #e2e8f0;
      min-height: 100vh;
      padding: 40px 15px;
      padding-top: 100px;
    }
    .back-button {
      position: fixed; top: 24px; left: 24px; width: 56px; height: 56px;
      background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(40px);
      border-radius: 16px; border: 1.5px solid rgba(148, 163, 184, 0.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.3s; z-index: 1000; color: #cbd5e1;
    }
    .back-button:hover { border-color: rgba(249, 115, 22, 0.4); color: #f97316; transform: translateX(-6px); }
    .back-button.locked { pointer-events: none; opacity: 0.4; }
    .logo {
      font-size: 42px; font-weight: 900;
      background: linear-gradient(135deg, #f97316 0%, #f59e0b 50%, #ef4444 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      text-align: center; margin-bottom: 10px;
    }
    .tagline { color: #64748b; font-size: 14px; margin-bottom: 32px; text-align: center; }
    .layout { display: grid; grid-template-columns: 380px 1fr; gap: 20px; max-width: 1300px; margin: 0 auto; align-items: start; }
    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
    .card {
      background: rgba(15, 23, 42, 0.4); border-radius: 24px; padding: 26px;
      border: 1px solid rgba(148, 163, 184, 0.08); backdrop-filter: blur(40px);
    }
    h2 { font-size: 15px; color: #f8fafc; margin-bottom: 16px; }
    label.small { display: block; font-size: 12px; font-weight: 600; color: #94a3b8; margin-bottom: 8px; }
    select {
      width: 100%; padding: 10px 12px; border-radius: 10px; margin-bottom: 18px;
      background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(148, 163, 184, 0.2);
      color: #e2e8f0; font-family: 'Inter', sans-serif; font-size: 13px;
    }
    .upload-area {
      padding: 40px 24px; border-radius: 14px;
      border: 2px dashed rgba(249, 115, 22, 0.3); background: rgba(15, 23, 42, 0.6);
      text-align: center; cursor: pointer; transition: all 0.3s;
    }
    .upload-area:hover, .upload-area.dragover { border-color: #f97316; background: rgba(249, 115, 22, 0.08); }
    .upload-icon { font-size: 40px; margin-bottom: 10px; }
    .upload-text { color: #cbd5e1; font-size: 13px; }
    input[type="file"] { display: none; }
    .preview-img {
      margin-top: 18px; width: 100%; max-height: 260px; object-fit: contain; border-radius: 12px;
      background: rgba(6, 10, 22, 0.8); border: 1px solid rgba(148, 163, 184, 0.15); display: none;
    }
    .preview-img.show { display: block; }
    button.action {
      width: 100%; padding: 13px; border-radius: 10px; border: none; cursor: pointer;
      font-size: 14px; font-weight: 700; background: linear-gradient(135deg, #f97316, #ea580c);
      color: white; transition: all 0.25s; margin-top: 18px;
    }
    button.action:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(249, 115, 22, 0.35); }
    button.action:disabled { opacity: 0.5; cursor: not-allowed; }
    .progress-wrap { margin-top: 18px; display: none; }
    .progress-wrap.show { display: block; }
    .progress-label { font-size: 12px; color: #94a3b8; margin-bottom: 6px; display: flex; justify-content: space-between; }
    .progress-track { width: 100%; height: 10px; border-radius: 999px; background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(148, 163, 184, 0.15); overflow: hidden; }
    .progress-fill { height: 100%; width: 0%; background: linear-gradient(135deg, #f97316, #f59e0b); transition: width 0.25s ease; }
    .result-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .btn-row { display: flex; gap: 8px; }
    .btn-secondary {
      padding: 9px 16px; border-radius: 10px; cursor: pointer; font-size: 12.5px; font-weight: 700;
      background: rgba(148, 163, 184, 0.12); color: #cbd5e1; border: 1px solid rgba(148, 163, 184, 0.2);
    }
    .btn-secondary:hover { background: rgba(148, 163, 184, 0.2); }
    textarea {
      width: 100%; height: 600px; resize: vertical;
      background: rgba(6, 10, 22, 0.8); color: #e2e8f0;
      border: 1px solid rgba(148, 163, 184, 0.15); border-radius: 14px;
      padding: 16px; font-family: 'JetBrains Mono', monospace; font-size: 13px; line-height: 1.6;
    }
    .conf-badge { font-size: 12px; color: #64748b; }
  </style>
</head>
<body>
  <div class="back-button" id="back-button" onclick="if(!busy) location.href='/captureocr'">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M19 12H5M5 12L12 19M5 12L12 5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <div class="logo">🔍 OCR Local</div>
  <div class="tagline">Extraia texto editável de imagens — reconhecimento roda 100% no navegador</div>

  <div class="layout">
    <div class="card">
      <h2>Imagem</h2>
      <label class="small">Idioma do texto</label>
      <select id="lang-select">
        <option value="por">Português</option>
        <option value="eng">Inglês</option>
        <option value="spa">Espanhol</option>
        <option value="por+eng">Português + Inglês</option>
      </select>

      <div class="upload-area" id="upload-area" onclick="document.getElementById('file-input').click()">
        <div class="upload-icon">📷</div>
        <div class="upload-text">Clique ou arraste uma imagem (print, recibo, foto de página)</div>
      </div>
      <input type="file" id="file-input" accept="image/*">
      <img class="preview-img" id="preview-img">

      <button class="action" id="run-btn" onclick="runOCR()" disabled>🔍 Extrair texto</button>

      <div class="progress-wrap" id="progress-wrap">
        <div class="progress-label"><span id="progress-stage">Preparando...</span><span id="progress-pct">0%</span></div>
        <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      </div>
    </div>

    <div class="card">
      <div class="result-header">
        <h2 style="margin:0;">Texto extraído</h2>
        <div class="btn-row">
          <span class="conf-badge" id="conf-badge"></span>
          <button class="btn-secondary" onclick="copyText()">📋 Copiar</button>
          <button class="btn-secondary" onclick="downloadText()">⬇️ Baixar .txt</button>
        </div>
      </div>
      <textarea id="output" placeholder="O texto reconhecido aparece aqui, editável..." spellcheck="false"></textarea>
    </div>
  </div>

  <script>
    let busy = false;
    let selectedFile = null;

    const fileInput = document.getElementById('file-input');
    const uploadArea = document.getElementById('upload-area');
    const previewImg = document.getElementById('preview-img');
    const runBtn = document.getElementById('run-btn');
    const backButton = document.getElementById('back-button');
    const progressWrap = document.getElementById('progress-wrap');
    const progressStage = document.getElementById('progress-stage');
    const progressPct = document.getElementById('progress-pct');
    const progressFill = document.getElementById('progress-fill');

    function handleFile(file) {
      if (!file || !file.type.startsWith('image/')) return;
      selectedFile = file;
      previewImg.src = URL.createObjectURL(file);
      previewImg.classList.add('show');
      runBtn.disabled = false;
    }

    fileInput.addEventListener('change', e => handleFile(e.target.files[0]));
    uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.classList.add('dragover'); });
    uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
    uploadArea.addEventListener('drop', e => {
      e.preventDefault();
      uploadArea.classList.remove('dragover');
      if (busy) return;
      handleFile(e.dataTransfer.files[0]);
    });
    document.addEventListener('paste', e => {
      if (busy) return;
      const item = Array.from(e.clipboardData.items || []).find(i => i.type.startsWith('image/'));
      if (item) handleFile(item.getAsFile());
    });

    function setLocked(locked) {
      busy = locked;
      runBtn.disabled = locked || !selectedFile;
      backButton.classList.toggle('locked', locked);
    }

    async function runOCR() {
      if (busy || !selectedFile) return;
      setLocked(true);
      progressWrap.classList.add('show');
      document.getElementById('conf-badge').textContent = '';
      progressFill.style.width = '0%';
      progressPct.textContent = '0%';
      progressStage.textContent = 'Carregando modelo...';

      try {
        const lang = document.getElementById('lang-select').value;
        const result = await Tesseract.recognize(selectedFile, lang, {
          logger: m => {
            if (m.progress !== undefined) {
              const pct = Math.round(m.progress * 100);
              progressFill.style.width = pct + '%';
              progressPct.textContent = pct + '%';
              progressStage.textContent = m.status || 'Processando...';
            }
          }
        });
        document.getElementById('output').value = result.data.text.trim();
        document.getElementById('conf-badge').textContent = `Confiança: ${Math.round(result.data.confidence)}%`;
        progressStage.textContent = 'Concluído!';
      } catch (e) {
        document.getElementById('output').value = '';
        progressStage.textContent = 'Erro: ' + e.message;
      } finally {
        setLocked(false);
      }
    }

    function copyText() {
      const out = document.getElementById('output');
      if (out.value) navigator.clipboard.writeText(out.value);
    }
    function downloadText() {
      const text = document.getElementById('output').value;
      if (!text) return;
      const blob = new Blob([text], { type: 'text/plain' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'texto-extraido.txt';
      a.click();
    }
  </script>
</body>
</html>
