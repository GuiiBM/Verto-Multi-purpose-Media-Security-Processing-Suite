<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VscoSaver</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --vs: linear-gradient(135deg, #ffffff 0%, #e7e5e4 50%, #a8a29e 100%);
      --accent: #f5f5f4;
      --ink: #0c0a09;
      --card: rgba(15, 23, 42, 0.45);
      --line: rgba(148, 163, 184, 0.1);
      --muted: #94a3b8;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: #0a0f1e;
      background-image:
        radial-gradient(at 0% 0%, rgba(255, 255, 255, 0.05) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(214, 211, 209, 0.05) 0px, transparent 50%),
        radial-gradient(at 50% 100%, rgba(168, 162, 158, 0.04) 0px, transparent 50%);
      color: #e2e8f0; min-height: 100vh; padding: 100px 16px 60px;
    }
    .back-button {
      position: fixed; top: 24px; left: 24px; width: 56px; height: 56px;
      background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(40px);
      border-radius: 16px; border: 1.5px solid rgba(148, 163, 184, 0.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.3s; z-index: 50; color: #cbd5e1;
    }
    .back-button:hover { border-color: rgba(245, 245, 244, 0.45); color: #fff; transform: translateX(-6px); }
    .wrap { max-width: 1040px; margin: 0 auto; }
    .logo {
      font-size: 52px; font-weight: 900; text-align: center; letter-spacing: 1px;
      background: var(--vs); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 25px rgba(255, 255, 255, 0.18));
    }
    .tagline { color: #64748b; font-size: 15px; margin: 8px 0 32px; text-align: center; font-weight: 500; }

    .search {
      display: flex; gap: 10px; background: var(--card); border: 1px solid var(--line);
      border-radius: 20px; padding: 10px; backdrop-filter: blur(40px); max-width: 760px; margin: 0 auto;
      transition: border-color .2s, box-shadow .2s;
    }
    .search:focus-within { border-color: rgba(245, 245, 244, 0.4); box-shadow: 0 0 0 4px rgba(245, 245, 244, 0.06); }
    .search input {
      flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: #f8fafc;
      font: 500 15px 'Inter', sans-serif; padding: 12px 14px;
    }
    .search input::placeholder { color: #475569; }
    .btn {
      border: 0; cursor: pointer; border-radius: 14px; font: 700 14px 'Inter', sans-serif;
      padding: 12px 18px; color: var(--ink); background: var(--accent); transition: transform .15s, opacity .15s; white-space: nowrap;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn:disabled { opacity: .5; cursor: default; transform: none; }
    .btn.ghost { background: rgba(148, 163, 184, 0.1); color: #e2e8f0; border: 1px solid var(--line); }
    .btn.ghost:hover { border-color: rgba(245, 245, 244, 0.4); }
    .btn.sm { padding: 8px 12px; font-size: 13px; border-radius: 11px; }
    .session { text-align: center; font-size: 12.5px; color: #64748b; margin-top: 12px; min-height: 18px; }
    .session b { color: #34d399; font-weight: 600; }

    .notice {
      max-width: 760px; margin: 20px auto 0; padding: 14px 18px; border-radius: 14px; font-size: 14px; line-height: 1.6;
      background: rgba(239, 68, 68, 0.08); border: 1px solid rgba(239, 68, 68, 0.25); color: #fecaca; display: none;
    }
    .notice.info { background: rgba(148, 163, 184, 0.07); border-color: var(--line); color: #cbd5e1; }

    .loader { display: none; justify-content: center; margin: 48px 0; }
    .spinner { width: 42px; height: 42px; border-radius: 50%; border: 3px solid rgba(245, 245, 244, 0.12); border-top-color: var(--accent); animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Perfil */
    #result { display: none; margin-top: 36px; }
    .profile {
      display: flex; gap: 24px; align-items: center; background: var(--card); border: 1px solid var(--line);
      border-radius: 24px; padding: 24px; backdrop-filter: blur(40px);
    }
    .avatar-ring { padding: 3px; border-radius: 50%; background: rgba(245, 245, 244, 0.3); flex-shrink: 0; }
    .avatar-ring img { display: block; width: 96px; height: 96px; border-radius: 50%; border: 3px solid #0a0f1e; object-fit: cover; background: #1e293b; }
    .p-info { flex: 1; min-width: 0; }
    .p-user { font-size: 22px; font-weight: 800; color: #f8fafc; word-break: break-word; }
    .p-name { color: #cbd5e1; font-weight: 600; margin-top: 2px; }
    .p-stats { display: flex; gap: 20px; margin: 10px 0; font-size: 14px; color: var(--muted); flex-wrap: wrap; }
    .p-stats b { color: #f8fafc; }
    .p-bio { font-size: 14px; color: #cbd5e1; white-space: pre-line; line-height: 1.5; max-height: 4.5em; overflow: hidden; }
    .p-actions { display: flex; flex-direction: column; gap: 8px; }

    /* Abas */
    .tabs { display: flex; gap: 6px; margin: 28px 0 18px; border-bottom: 1px solid var(--line); overflow-x: auto; }
    .tab {
      background: none; border: 0; color: var(--muted); font: 700 14px 'Inter', sans-serif; padding: 12px 16px; cursor: pointer;
      border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap;
    }
    .tab .count { font-weight: 600; color: #64748b; margin-left: 4px; }
    .tab.active { color: #f8fafc; border-bottom-color: var(--accent); }
    .panel { display: none; }
    .panel.active { display: block; }
    .panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 12px; flex-wrap: wrap; }
    .panel-head h3 { font-size: 15px; color: #cbd5e1; font-weight: 700; }
    .empty { color: #64748b; text-align: center; padding: 48px 12px; font-size: 14px; }
    .section-error { color: #fca5a5; font-size: 13px; margin-bottom: 12px; }
    .space-desc { font-size: 13.5px; color: var(--muted); margin: -6px 0 14px; white-space: pre-line; line-height: 1.5; }
    .space-desc:empty { display: none; }

    /* Spaces */
    .hl-row { display: flex; gap: 18px; overflow-x: auto; padding: 4px 2px 14px; margin-bottom: 10px; }
    .hl { flex-shrink: 0; width: 84px; text-align: center; cursor: pointer; background: none; border: 0; color: inherit; font-family: inherit; }
    .hl .ring { padding: 3px; border-radius: 50%; background: rgba(148, 163, 184, 0.25); transition: background .2s; }
    .hl.active .ring, .hl:hover .ring { background: var(--vs); }
    .hl img { display: block; width: 72px; height: 72px; border-radius: 50%; border: 3px solid #0a0f1e; object-fit: cover; background: #1e293b; }
    .hl span { display: block; font-size: 12px; margin-top: 6px; color: #cbd5e1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Grade */
    .grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
    .card {
      position: relative; border-radius: 14px; overflow: hidden; background: #111827; cursor: pointer;
      aspect-ratio: 1 / 1; border: 1px solid var(--line);
    }
    .card img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .3s; }
    .card:hover img { transform: scale(1.04); }
    .card .badges { position: absolute; top: 8px; right: 8px; display: flex; gap: 6px; }
    .badge {
      background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(8px); color: #fff; font-size: 11px; font-weight: 700;
      padding: 4px 7px; border-radius: 8px; display: flex; align-items: center; gap: 4px;
    }
    .card .dl {
      position: absolute; bottom: 8px; right: 8px; width: 36px; height: 36px; border-radius: 10px;
      background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(8px); color: #fff; display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity .2s, background .2s, color .2s; text-decoration: none;
    }
    .card:hover .dl { opacity: 1; }
    .card .dl:hover { background: var(--accent); color: var(--ink); }
    .card .meta {
      position: absolute; left: 0; right: 0; bottom: 0; padding: 26px 52px 10px 10px; font-size: 11.5px; color: #e2e8f0;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.75)); pointer-events: none;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .card .meta b { font-weight: 800; letter-spacing: .5px; }
    .card.focus { outline: 2px solid var(--accent); outline-offset: 2px; }
    @media (hover: none) { .card .dl { opacity: 1; } }
    .more { display: flex; justify-content: center; margin-top: 20px; }

    /* Visualizador */
    .viewer {
      position: fixed; inset: 0; background: rgba(2, 6, 23, 0.94); backdrop-filter: blur(10px); z-index: 100;
      display: none; align-items: center; justify-content: center; padding: 20px;
    }
    .viewer.open { display: flex; }
    .v-box { display: flex; gap: 20px; max-width: 1100px; width: 100%; max-height: 100%; align-items: stretch; }
    .v-media { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; min-height: 0; min-width: 0; }
    .v-media img, .v-media video { max-width: 100%; max-height: calc(100vh - 80px); border-radius: 14px; display: block; background: #000; }
    .v-wait {
      position: absolute; inset: 0; display: flex; flex-direction: column; gap: 12px; align-items: center; justify-content: center;
      font-size: 13px; color: #e2e8f0; pointer-events: none; text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
    }
    .v-side {
      width: 300px; flex-shrink: 0; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px;
      display: flex; flex-direction: column; gap: 12px; max-height: calc(100vh - 80px); overflow: auto;
    }
    .v-side .cap { font-size: 13.5px; line-height: 1.55; color: #cbd5e1; white-space: pre-line; word-break: break-word; }
    .v-side .when { font-size: 12px; color: #64748b; }
    .v-side .by { font-size: 13px; color: var(--muted); }
    .v-side .by a { color: #f8fafc; font-weight: 700; text-decoration: none; }
    .v-side .by a:hover { text-decoration: underline; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip { font-size: 11.5px; font-weight: 600; padding: 4px 8px; border-radius: 8px; background: rgba(148, 163, 184, 0.12); color: #cbd5e1; }
    .v-close, .v-nav {
      position: fixed; background: rgba(15, 23, 42, 0.85); border: 1px solid var(--line); color: #e2e8f0; cursor: pointer;
      width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; z-index: 101; font-size: 22px;
    }
    .v-close { top: 20px; right: 20px; }
    .v-nav.prev { left: 20px; top: 50%; transform: translateY(-50%); }
    .v-nav.next { right: 20px; top: 50%; transform: translateY(-50%); }
    .v-nav:hover, .v-close:hover { border-color: rgba(245, 245, 244, 0.45); color: #fff; }

    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); opacity: 0;
      background: #0f172a; border: 1px solid var(--line); color: #e2e8f0; padding: 12px 18px; border-radius: 12px;
      font-size: 14px; transition: all .25s; z-index: 200; pointer-events: none; max-width: calc(100% - 32px);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 760px) {
      body { padding-top: 92px; }
      .logo { font-size: 40px; }
      .profile { flex-direction: column; text-align: center; }
      .p-stats { justify-content: center; }
      .p-actions { flex-direction: row; justify-content: center; flex-wrap: wrap; }
      .grid { grid-template-columns: repeat(3, 1fr); gap: 4px; }
      .card { border-radius: 6px; }
      .card .meta { display: none; }
      .v-box { flex-direction: column; overflow: auto; }
      .v-side { width: 100%; max-height: none; }
      .v-media img, .v-media video { max-height: 65vh; }
      .v-nav { top: auto; bottom: 20px; transform: none; }
      .search .btn span { display: none; }
    }
  </style>
</head>
<body>
  <div class="back-button" onclick="location.href='/'" title="Voltar">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M19 12H5M5 12L12 19M5 12L12 5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>

  <div class="wrap">
    <div class="logo">VscoSaver</div>
    <div class="tagline">Cole o link de um perfil, foto, vídeo, coleção ou space do VSCO — o resto é automático</div>

    <form class="search" id="form" autocomplete="off">
      <input id="link" type="text" placeholder="https://vsco.co/usuario/gallery" aria-label="Link do VSCO">
      <button type="button" class="btn ghost" id="pasteBtn" title="Colar e buscar">📋 <span>Colar</span></button>
      <button type="submit" class="btn" id="goBtn">Buscar</button>
    </form>
    <div class="session"><b>●</b> Sem login: o VSCO é público, funciona com qualquer perfil</div>
    <div class="notice" id="notice"></div>

    <div class="loader" id="loader"><div class="spinner"></div></div>

    <div id="result">
      <div class="profile">
        <div class="avatar-ring"><img id="pAvatar" alt=""></div>
        <div class="p-info">
          <div class="p-user" id="pUser"></div>
          <div class="p-name" id="pName"></div>
          <div class="p-stats" id="pStats"></div>
          <div class="p-bio" id="pBio"></div>
        </div>
        <div class="p-actions">
          <a class="btn ghost sm" id="pOpen" target="_blank" rel="noopener">Abrir no VSCO ↗</a>
          <a class="btn ghost sm" id="pAvatarDl">Baixar foto de perfil</a>
          <a class="btn ghost sm" id="pLink" target="_blank" rel="noopener noreferrer">Link da bio ↗</a>
        </div>
      </div>

      <div class="tabs" role="tablist">
        <button class="tab" data-tab="gallery">Galeria<span class="count" id="c-gallery"></span></button>
        <button class="tab" data-tab="collection">Coleção<span class="count" id="c-collection"></span></button>
        <button class="tab" data-tab="spaces">Spaces<span class="count" id="c-spaces"></span></button>
      </div>

      <section class="panel" id="panel-gallery">
        <div class="panel-head">
          <h3 id="title-gallery">Galeria</h3>
          <button class="btn sm" data-zip="gallery">⬇ Baixar carregados (.zip)</button>
        </div>
        <div class="section-error" id="err-gallery"></div>
        <div class="grid" id="grid-gallery"></div>
        <div class="more"><button class="btn ghost" id="more-gallery" data-more="gallery" style="display:none">Carregar mais</button></div>
      </section>

      <section class="panel" id="panel-collection">
        <div class="panel-head">
          <h3 id="title-collection">Coleção</h3>
          <button class="btn sm" data-zip="collection">⬇ Baixar carregados (.zip)</button>
        </div>
        <div class="section-error" id="err-collection"></div>
        <div class="grid" id="grid-collection"></div>
        <div class="more"><button class="btn ghost" id="more-collection" data-more="collection" style="display:none">Carregar mais</button></div>
      </section>

      <section class="panel" id="panel-spaces">
        <div class="section-error" id="err-spaces"></div>
        <div class="hl-row" id="spaceRow"></div>
        <div class="panel-head" id="spaceHead" style="display:none">
          <h3 id="title-space"></h3>
          <button class="btn sm" data-zip="space">⬇ Baixar carregados (.zip)</button>
        </div>
        <div class="space-desc" id="spaceDesc"></div>
        <div class="grid" id="grid-space"></div>
        <div class="more"><button class="btn ghost" id="more-space" data-more="space" style="display:none">Carregar mais</button></div>
      </section>
    </div>
  </div>

  <div class="viewer" id="viewer">
    <button class="v-close" id="vClose" title="Fechar (Esc)">✕</button>
    <button class="v-nav prev" id="vPrev" title="Anterior (←)">‹</button>
    <button class="v-nav next" id="vNext" title="Próximo (→)">›</button>
    <div class="v-box">
      <div class="v-media" id="vMedia"></div>
      <aside class="v-side" id="vSide"></aside>
    </div>
  </div>
  <div class="toast" id="toast"></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const newList = () => ({ items: [], next: null, loading: false });
  const state = { profile: null, lists: { gallery: newList(), collection: newList(), space: newList() },
                  spaces: [], spaceCache: new Map(), spaceCurrent: null };
  let viewer = null;  // { list, index }

  // ---------- utilidades ----------
  const proxied = url => '/vscosaver/media?url=' + encodeURIComponent(url);
  const dlHref = m => proxied(m.url) + '&dl=1&name=' + encodeURIComponent(m.filename);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const fmtNum = n => n == null ? '—' : Intl.NumberFormat('pt-BR', { notation: n >= 10000 ? 'compact' : 'standard' }).format(n);
  const fmtDate = ts => ts ? new Date(ts * 1000).toLocaleString('pt-BR', { dateStyle: 'medium', timeStyle: 'short' }) : '';
  const fmtDay = ts => ts ? new Date(ts * 1000).toLocaleDateString('pt-BR') : '';
  const fmtDur = s => s ? `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, '0')}` : '';
  const fmtShutter = s => {  // o VSCO guarda 33333/1000000; a câmera mostraria 1/30
    const m = /^(\d+)\/(\d+)$/.exec(String(s));
    if (!m || +m[1] === 0) return String(s);
    const v = m[1] / m[2];
    return v >= 1 ? `${+v.toFixed(1)}s` : `1/${Math.round(1 / v)}`;
  };
  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 3200);
  }
  function notice(msg, info) {
    const n = $('notice'); n.style.display = msg ? 'block' : 'none';
    n.className = 'notice' + (info ? ' info' : ''); n.textContent = msg || '';
  }
  const ICON_DL = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 4v11m0 0l-4.5-4.5M12 15l4.5-4.5M5 19h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  // Vídeos novos do VSCO vêm em pedaços (HLS): o servidor junta tudo antes de entregar.
  document.addEventListener('click', e => {
    if (e.target.closest('a[data-hls]')) toast('Juntando o vídeo — o download começa em alguns segundos.');
  });

  // ---------- busca ----------
  $('form').addEventListener('submit', e => { e.preventDefault(); resolve($('link').value); });
  $('link').addEventListener('paste', () => setTimeout(() => resolve($('link').value), 0));
  $('pasteBtn').addEventListener('click', async () => {
    try {
      const text = await navigator.clipboard.readText();
      $('link').value = text.trim(); resolve(text);
    } catch { $('link').focus(); toast('Use Ctrl+V no campo — o navegador bloqueou a leitura da área de transferência.'); }
  });

  async function resolve(link) {
    link = (link || '').trim();
    if (!link) return;
    if (resolve.busy === link) return;
    resolve.busy = link;
    notice(''); $('result').style.display = 'none'; $('loader').style.display = 'flex'; $('goBtn').disabled = true;
    try {
      const res = await fetch('/vscosaver/resolve', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ link }) });
      const data = await res.json();
      if (!data.success) { notice(data.error); return; }
      render(data);
      const u = new URL(location.href); u.searchParams.set('link', link); history.replaceState(null, '', u);
    } catch (err) {
      notice('Não consegui falar com o servidor local do Verto.');
    } finally {
      resolve.busy = null; $('loader').style.display = 'none'; $('goBtn').disabled = false;
    }
  }

  // ---------- render ----------
  function render(data) {
    const p = state.profile = data.profile;
    state.lists = {
      gallery: { items: data.gallery.items, next: data.gallery.next_cursor, loading: false },
      collection: { items: data.collection.items, next: data.collection.next_page, loading: false, total: data.collection.total },
      space: newList(),
    };
    state.spaces = data.spaces || [];
    state.spaceCache.clear(); state.spaceCurrent = null;

    $('pAvatar').src = p.avatar ? proxied(p.avatar) : '';
    $('pUser').textContent = p.username;
    $('pName').textContent = p.name || '';
    $('pBio').textContent = p.description || '';
    $('pOpen').href = `https://vsco.co/${encodeURIComponent(p.username)}/gallery`;
    if (p.avatar_full) { $('pAvatarDl').style.display = ''; $('pAvatarDl').href = dlHref({ url: p.avatar_full, filename: `${p.username}_perfil.jpg` }); }
    else $('pAvatarDl').style.display = 'none';
    const ext = p.external_link;
    $('pLink').style.display = ext ? '' : 'none';
    if (ext) $('pLink').href = /^https?:\/\//i.test(ext) ? ext : 'https://' + ext;

    for (const k of ['gallery', 'collection', 'spaces']) $('err-' + k).textContent = (data.errors || {})[k] || '';
    renderList('gallery'); renderList('collection'); renderSpaceTray();
    $('grid-space').innerHTML = ''; $('spaceHead').style.display = 'none'; $('spaceDesc').textContent = '';
    $('more-space').style.display = 'none';
    $('result').style.display = 'block';

    // Abre direto no que o link apontava.
    const f = data.focus || {};
    if ((f.kind === 'media' || f.kind === 'video') && f.media) {
      switchTab('gallery');
      const L = state.lists.gallery;
      let i = L.items.findIndex(x => x.id === f.media.id);
      if (i < 0) { L.items.unshift(f.media); renderList('gallery'); i = 0; }
      markFocus('grid-gallery', i); openViewer(L.items, i);
    } else if (f.kind === 'space' && f.space) {
      if (!state.spaces.some(s => s.id === f.space.id)) { state.spaces.unshift(f.space); renderSpaceTray(); updateStats(); }
      openSpace(f.space.id); switchTab('spaces');
    } else if (f.kind === 'collection') {
      switchTab('collection');
    } else if (f.kind === 'spaces') {
      switchTab('spaces');
    } else {
      const L = state.lists;
      switchTab(L.gallery.items.length || !L.collection.items.length ? 'gallery' : 'collection');
    }
  }

  function markFocus(gridId, i) {
    const el = $(gridId).children[i];
    if (el) { el.classList.add('focus'); el.scrollIntoView({ block: 'nearest' }); }
  }

  function updateStats() {
    const L = state.lists, g = L.gallery;
    const galleryCount = g.items.length + (g.next ? '+' : '');
    $('pStats').innerHTML = [
      `<span><b>${galleryCount}</b> na galeria</span>`,
      L.collection.total ? `<span><b>${fmtNum(L.collection.total)}</b> na coleção</span>` : '',
      state.spaces.length ? `<span><b>${state.spaces.length}</b> spaces</span>` : '',
    ].join('');
    $('c-gallery').textContent = galleryCount;
    $('c-collection').textContent = L.collection.total ?? L.collection.items.length;
    $('c-spaces').textContent = state.spaces.length;
  }

  function card(m, key, onOpen) {
    const el = document.createElement('div');
    el.className = 'card';
    const fromOther = key !== 'gallery' && m.owner && m.owner !== state.profile.username;
    const meta = [m.preset ? `<b>${esc(m.preset)}</b>` : '', fromOther ? esc(m.owner) : '', fmtDay(m.taken_at)]
      .filter(Boolean).join(' · ');
    el.innerHTML = `<img loading="lazy" src="${m.thumb ? proxied(m.thumb) : ''}" alt="">
      <div class="badges">${m.type === 'video' ? `<span class="badge">▶ ${fmtDur(m.duration)}</span>` : ''}</div>
      ${meta ? `<div class="meta">${meta}</div>` : ''}
      <a class="dl" href="${dlHref(m)}" title="Baixar" download${m.hls ? ' data-hls' : ''}>${ICON_DL}</a>`;
    el.addEventListener('click', e => { if (!e.target.closest('.dl')) onOpen(); });
    return el;
  }

  const TITLES = { gallery: 'Galeria', collection: 'Coleção (reposts)' };
  function renderList(key) {
    const L = state.lists[key], grid = $('grid-' + key);
    grid.innerHTML = '';
    if (!L.items.length) grid.innerHTML = '<div class="empty" style="grid-column:1/-1">Nada por aqui.</div>';
    L.items.forEach((m, i) => grid.appendChild(card(m, key, () => openViewer(L.items, i))));
    $('more-' + key).style.display = L.next ? '' : 'none';
    const loaded = `${L.items.length}${L.next ? '+' : ''}`;
    if (key === 'space') {
      const s = state.spaces.find(x => x.id === state.spaceCurrent) || {};
      $('title-space').textContent = `${s.title || 'Space'} · ${loaded} itens`;
    } else {
      $('title-' + key).textContent = `${TITLES[key]}${L.items.length ? ` · ${L.items.length} carregados` : ''}`;
    }
    updateStats();
  }

  async function loadMore(key) {
    const L = state.lists[key], p = state.profile;
    if (!L.next || L.loading) return;
    L.loading = true;
    const btn = $('more-' + key); btn.disabled = true; btn.textContent = 'Carregando...';
    let url;
    if (key === 'gallery') url = '/vscosaver/gallery?' + new URLSearchParams({ site_id: p.id, username: p.username, cursor: L.next });
    else if (key === 'collection') url = '/vscosaver/collection?' + new URLSearchParams({ collection_id: p.collection_id, username: p.username, page: L.next });
    else url = `/vscosaver/space/${encodeURIComponent(state.spaceCurrent)}?` + new URLSearchParams({ cursor: L.next });
    try {
      const data = await (await fetch(url)).json();
      if (!data.success) throw new Error(data.error);
      const seen = new Set(L.items.map(m => m.id));
      L.items.push(...data.items.filter(m => !seen.has(m.id)));
      L.next = key === 'collection' ? data.next_page : data.next_cursor;
      if (state.lists[key] === L) renderList(key);  // perfil ou space pode ter mudado no meio
    } catch (err) { toast(err.message || 'Erro ao carregar mais.'); }
    finally { L.loading = false; btn.disabled = false; btn.textContent = 'Carregar mais'; }
  }
  document.querySelectorAll('[data-more]').forEach(btn => {
    const key = btn.dataset.more;
    btn.addEventListener('click', () => loadMore(key));
    new IntersectionObserver(es => { if (es[0].isIntersecting && btn.closest('.panel').classList.contains('active')) loadMore(key); },
                             { rootMargin: '400px' }).observe(btn);
  });

  // ---------- spaces ----------
  function renderSpaceTray() {
    const row = $('spaceRow'); row.innerHTML = '';
    if (!state.spaces.length) { row.innerHTML = '<div class="empty" style="width:100%">Nenhum space.</div>'; return; }
    for (const s of state.spaces) {
      const b = document.createElement('button');
      b.className = 'hl' + (state.spaceCurrent === s.id ? ' active' : ''); b.dataset.id = s.id;
      b.innerHTML = `<div class="ring"><img loading="lazy" src="${s.cover ? proxied(s.cover) : ''}" alt=""></div><span>${esc(s.title || 'Space')}</span>`;
      b.addEventListener('click', () => openSpace(s.id));
      row.appendChild(b);
    }
  }

  async function openSpace(id) {
    state.spaceCurrent = id;
    document.querySelectorAll('#spaceRow .hl').forEach(b => b.classList.toggle('active', b.dataset.id === id));
    $('spaceDesc').textContent = (state.spaces.find(x => x.id === id) || {}).description || '';
    let L = state.spaceCache.get(id);
    if (!L) {
      $('spaceHead').style.display = 'none'; $('more-space').style.display = 'none';
      $('grid-space').innerHTML = '<div class="empty" style="grid-column:1/-1"><div class="spinner" style="margin:0 auto"></div></div>';
      try {
        const data = await (await fetch('/vscosaver/space/' + encodeURIComponent(id))).json();
        if (!data.success) throw new Error(data.error);
        L = { items: data.items, next: data.next_cursor, loading: false };
        state.spaceCache.set(id, L);
      } catch (err) {
        if (state.spaceCurrent === id)
          $('grid-space').innerHTML = `<div class="empty" style="grid-column:1/-1">${esc(err.message || 'Erro ao carregar o space.')}</div>`;
        return;
      }
    }
    if (state.spaceCurrent !== id) return;
    state.lists.space = L;
    $('spaceHead').style.display = 'flex';
    renderList('space');
  }

  // ---------- abas ----------
  function switchTab(name) {
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
    document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + name));
    if (name === 'spaces' && !state.spaceCurrent && state.spaces.length) openSpace(state.spaces[0].id);
  }
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => switchTab(t.dataset.tab)));

  // ---------- zip ----------
  document.querySelectorAll('[data-zip]').forEach(b => b.addEventListener('click', async () => {
    const key = b.dataset.zip, u = state.profile.username, items = state.lists[key].items;
    const space = state.spaces.find(s => s.id === state.spaceCurrent) || {};
    const name = key === 'gallery' ? `${u}_galeria` : key === 'collection' ? `${u}_colecao` : `${u}_space_${space.title || state.spaceCurrent}`;
    if (!items.length) return toast('Nada para baixar aqui.');
    const label = b.textContent; b.disabled = true; b.textContent = `Preparando ${items.length} arquivos...`;
    try {
      const res = await fetch('/vscosaver/zip', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, items: items.map(m => ({ url: m.url, filename: m.filename })) }) });
      if (!res.ok) throw new Error();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(await res.blob()); a.download = name.replace(/[^\w.-]/g, '_') + '.zip';
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    } catch { toast('Falha ao gerar o .zip — tente de novo ou busque o perfil outra vez.'); }
    finally { b.disabled = false; b.textContent = label; }
  }));

  // ---------- visualizador ----------
  function openViewer(list, index) { viewer = { list, index }; $('viewer').classList.add('open'); document.body.style.overflow = 'hidden'; drawViewer(); }
  function closeViewer() { $('vMedia').innerHTML = ''; $('viewer').classList.remove('open'); document.body.style.overflow = ''; viewer = null; }
  function step(d) {
    if (!viewer) return;
    const ni = viewer.index + d;
    if (ni < 0 || ni >= viewer.list.length) return;
    viewer.index = ni; drawViewer();
  }
  function drawViewer() {
    const m = viewer.list[viewer.index], box = $('vMedia');
    if (m.type === 'video') {
      box.innerHTML = `<video src="${proxied(m.url)}" poster="${m.thumb ? proxied(m.thumb) : ''}" controls autoplay playsinline></video>` +
        (m.hls ? '<div class="v-wait" id="vWait"><div class="spinner"></div><span>Preparando vídeo...</span></div>' : '');
      const vid = box.querySelector('video'), wait = $('vWait');
      if (wait) {
        vid.addEventListener('loadeddata', () => wait.remove());
        vid.addEventListener('error', () => { wait.innerHTML = '<span>Não consegui carregar o vídeo.</span>'; });
      }
    } else {
      box.innerHTML = `<img src="${proxied(m.url)}" alt="">`;
    }

    const side = [];
    side.push(`<div class="when">${esc(fmtDate(m.taken_at))} · ${viewer.index + 1} de ${viewer.list.length}</div>`);
    if (m.owner && m.owner !== state.profile.username) {
      const link = '?link=' + encodeURIComponent(`https://vsco.co/${m.owner}/gallery`);
      side.push(`<div class="by">por <a href="${esc(link)}" title="Ver este perfil no VscoSaver">${esc(m.owner)}</a></div>`);
    }
    const x = m.exif || {};
    const chips = [
      m.preset ? `🎞 ${m.preset}` : '', m.camera ? `📷 ${m.camera}` : '',
      x.iso ? `ISO ${x.iso}` : '', x.shutter_speed ? fmtShutter(x.shutter_speed) : '',
      x.aperture ? `f/${Number(x.aperture).toFixed(1)}` : '', m.width && m.height ? `${m.width}×${m.height}` : '',
    ].filter(Boolean);
    if (chips.length) side.push(`<div class="chips">${chips.map(c => `<span class="chip">${esc(c)}</span>`).join('')}</div>`);
    if (m.caption) side.push(`<div class="cap">${esc(m.caption)}</div>`);
    side.push(`<a class="btn" href="${dlHref(m)}" download${m.hls ? ' data-hls' : ''}>${ICON_DL} Baixar ${m.type === 'video' ? 'vídeo' : 'foto'}</a>`);
    if (m.permalink) side.push(`<a class="btn ghost sm" href="${esc(m.permalink)}" target="_blank" rel="noopener">Abrir no VSCO ↗</a>`);
    $('vSide').innerHTML = side.join('');
    $('vPrev').style.visibility = viewer.index === 0 ? 'hidden' : 'visible';
    $('vNext').style.visibility = viewer.index === viewer.list.length - 1 ? 'hidden' : 'visible';
  }
  $('vClose').addEventListener('click', closeViewer);
  $('vPrev').addEventListener('click', () => step(-1));
  $('vNext').addEventListener('click', () => step(1));
  $('viewer').addEventListener('click', e => { if (e.target.id === 'viewer' || e.target.classList.contains('v-box')) closeViewer(); });
  document.addEventListener('keydown', e => {
    if (!viewer) return;
    if (e.key === 'Escape') closeViewer();
    else if (e.key === 'ArrowRight') step(1);
    else if (e.key === 'ArrowLeft') step(-1);
  });

  // Link na URL (?link=...) busca sozinho ao abrir a página.
  const initial = new URLSearchParams(location.search).get('link');
  if (initial) { $('link').value = initial; resolve(initial); }
})();
</script>
</body>
</html>
