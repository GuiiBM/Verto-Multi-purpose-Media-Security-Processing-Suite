<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Converter PDF</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0a0f1e;
      background-image: radial-gradient(at 0% 0%, rgba(239, 68, 68, 0.08) 0px, transparent 50%);
      color: #e2e8f0;
      min-height: 100vh;
      padding: 40px 15px;
      padding-top: 100px;
    }
    .back-button {
      position: fixed;
      top: 24px;
      left: 24px;
      width: 56px;
      height: 56px;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(40px);
      border-radius: 16px;
      border: 1.5px solid rgba(148, 163, 184, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s;
      z-index: 1000;
      color: #cbd5e1;
    }
    .back-button:hover {
      border-color: rgba(239, 68, 68, 0.4);
      color: #ef4444;
      transform: translateX(-6px);
    }
    .logo {
      font-size: 48px;
      font-weight: 900;
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 50%, #b91c1c 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
      margin-bottom: 10px;
    }
    .tagline {
      color: #64748b;
      font-size: 15px;
      margin-bottom: 40px;
      text-align: center;
    }
    .card {
      background: rgba(15, 23, 42, 0.4);
      border-radius: 28px;
      padding: 40px;
      border: 1px solid rgba(148, 163, 184, 0.08);
      backdrop-filter: blur(40px);
      max-width: 600px;
      margin: 0 auto;
    }
    h1 {
      font-size: 28px;
      color: #f8fafc;
      margin-bottom: 10px;
    }
    p.subtitle {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 32px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #cbd5e1;
    }
    input[type="file"] {
      display: none;
    }
    .file-upload-area {
      width: 100%;
      padding: 40px;
      border-radius: 12px;
      border: 2px dashed rgba(239, 68, 68, 0.3);
      background: rgba(15, 23, 42, 0.6);
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
    }
    .file-upload-area:hover {
      border-color: rgba(239, 68, 68, 0.5);
      background: rgba(15, 23, 42, 0.8);
    }
    .file-upload-area.dragover {
      border-color: #ef4444;
      background: rgba(239, 68, 68, 0.1);
    }
    .upload-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
    .upload-text {
      color: #cbd5e1;
      font-size: 14px;
      margin-bottom: 8px;
    }
    .upload-hint {
      color: #64748b;
      font-size: 12px;
    }
    .format-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin: 20px 0;
    }
    .format-btn {
      padding: 16px;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.2);
      background: rgba(15, 23, 42, 0.6);
      color: #94a3b8;
      cursor: pointer;
      text-align: center;
      font-size: 13px;
      transition: all 0.3s;
    }
    .format-btn:hover {
      border-color: rgba(239, 68, 68, 0.3);
    }
    .format-btn.active {
      border-color: #ef4444;
      background: rgba(239, 68, 68, 0.1);
      color: #ef4444;
    }
    .format-icon {
      font-size: 32px;
      margin-bottom: 8px;
    }
    button {
      margin-top: 20px;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: white;
    }
    .status {
      margin-top: 16px;
      font-size: 13px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
    }
    .status.ok {
      background: rgba(34, 197, 94, 0.1);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }
    .status.err {
      background: rgba(239, 68, 68, 0.1);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
  </style>
</head>
<body>
  <div class="back-button" onclick="location.href='/pdfs'">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M19 12H5M5 12L12 19M5 12L12 5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  
  <div class="logo">🔄 CONVERTER PDF</div>
  <div class="tagline">Converta PDF para outros formatos</div>
  
  <div class="card">
    <h1>Selecione o arquivo</h1>
    <p class="subtitle">Escolha PDF para converter ou imagem para criar PDF</p>
    
    <form method="POST" enctype="multipart/form-data">
      <label>Arquivo</label>
      <div class="file-upload-area" id="upload-area" onclick="document.getElementById('file').click()">
        <div class="upload-icon">📄</div>
        <div class="upload-text">Clique ou arraste o arquivo aqui</div>
        <div class="upload-hint">Suporta PDF e imagens</div>
      </div>
      <input type="file" id="file" name="file" accept=".pdf,image/*" required>
      
      <label style="margin-top: 20px;">Formato de saída</label>
      <div class="format-grid">
        <div class="format-btn active" onclick="setFormat('jpg')">
          <div class="format-icon">📷</div>
          JPG
        </div>
        <div class="format-btn" onclick="setFormat('png')">
          <div class="format-icon">🖼️</div>
          PNG
        </div>
        <div class="format-btn" onclick="setFormat('pdf')">
          <div class="format-icon">📄</div>
          PDF
        </div>
      </div>
      
      <input type="hidden" name="format" id="format" value="jpg">
      
      <button type="submit">🔄 Converter</button>
    </form>
    
    {% if status %}
      <div class="status ok">{{ status }}</div>
    {% elif error %}
      <div class="status err">{{ error }}</div>
    {% endif %}
  </div>
  
  <script>
    const uploadArea = document.getElementById('upload-area');
    const fileInput = document.getElementById('file');
    
    uploadArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadArea.classList.add('dragover');
    });
    
    uploadArea.addEventListener('dragleave', () => {
      uploadArea.classList.remove('dragover');
    });
    
    uploadArea.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadArea.classList.remove('dragover');
      fileInput.files = e.dataTransfer.files;
    });
    
    function setFormat(format) {
      document.querySelectorAll('.format-btn').forEach(b => b.classList.remove('active'));
      event.target.closest('.format-btn').classList.add('active');
      document.getElementById('format').value = format;
    }
  </script>
</body>
</html>
