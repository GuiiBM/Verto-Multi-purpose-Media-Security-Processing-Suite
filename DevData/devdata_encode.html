<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Encode / Decode</title>
  <meta name="theme-color" content="#0b0c0f">
  <link rel="icon" type="image/svg+xml" href="/static/localtools/verto.svg">
  <link rel="stylesheet" href="/static/localtools/base.css">
  <link rel="stylesheet" href="/static/localtools/app.css">
  <link rel="stylesheet" href="/static/localtools/modos/terminal.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--lt-sans);
      background: #0b0c0f;
      background-image: radial-gradient(at 0% 0%, rgba(234, 88, 12, 0.08) 0px, transparent 50%);
      color: #e2e8f0;
      min-height: 100vh;
      padding: 40px 15px;
      padding-top: 100px;
    }
    .back-button {
      position: fixed; top: 24px; left: 24px; width: 56px; height: 56px;
      background: rgba(24, 26, 31, 0.8); backdrop-filter: blur(40px);
      border-radius: 16px; border: 1.5px solid rgba(148, 163, 184, 0.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.3s; z-index: 1000; color: #cbd5e1;
    }
    .back-button:hover { border-color: rgba(234, 88, 12, 0.4); color: #ea580c; transform: translateX(-6px); }
    .logo {
      font-size: 44px; font-weight: 900;
      background: linear-gradient(135deg, #ea580c 0%, #fb923c 50%, #22c55e 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      text-align: center; margin-bottom: 10px;
    }
    .tagline { color: #64748b; font-size: 14px; margin-bottom: 32px; text-align: center; }
    .card {
      background: rgba(24, 26, 31, 0.4); border-radius: 28px; padding: 32px;
      border: 1px solid rgba(148, 163, 184, 0.08); backdrop-filter: blur(40px);
      max-width: 1300px; margin: 0 auto;
    }
    .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
    .tab {
      padding: 10px 18px; border-radius: 999px; border: 1px solid rgba(148, 163, 184, 0.2);
      background: rgba(24, 26, 31, 0.6); color: #94a3b8; cursor: pointer;
      font-size: 13px; font-weight: 600; transition: all 0.25s;
    }
    .tab.active { border-color: #ea580c; background: rgba(234, 88, 12, 0.15); color: #fdba74; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
    button.action {
      padding: 11px 20px; border-radius: 10px; border: none; cursor: pointer;
      font-size: 13px; font-weight: 700; transition: all 0.25s;
    }
    .btn-primary { background: linear-gradient(135deg, #ea580c, #c2410c); color: white; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(234, 88, 12, 0.35); }
    .btn-secondary { background: rgba(148, 163, 184, 0.12); color: #cbd5e1; border: 1px solid rgba(148, 163, 184, 0.2); }
    .btn-secondary:hover { background: rgba(148, 163, 184, 0.2); }
    .panes { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 900px) { .panes { grid-template-columns: 1fr; } }
    .pane-label { font-size: 12px; font-weight: 700; color: #94a3b8; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
    textarea {
      width: 100%; height: 300px; resize: vertical;
      background: rgba(6, 10, 22, 0.8); color: #e2e8f0;
      border: 1px solid rgba(148, 163, 184, 0.15); border-radius: 14px;
      padding: 16px; font-family: 'JetBrains Mono', monospace; font-size: 13px; line-height: 1.6;
    }
    textarea:focus { outline: none; border-color: rgba(234, 88, 12, 0.4); }
    .error-box {
      margin-top: 12px; padding: 12px 14px; border-radius: 10px; font-size: 13px;
      background: rgba(239, 68, 68, 0.1); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3);
      display: none;
    }
    .error-box.show { display: block; }
    .jwt-panels { display: none; margin-top: 20px; grid-template-columns: 1fr 1fr; gap: 20px; }
    .jwt-panels.show { display: grid; }
    @media (max-width: 900px) { .jwt-panels { grid-template-columns: 1fr; } }
    .jwt-box { background: rgba(6, 10, 22, 0.8); border: 1px solid rgba(148, 163, 184, 0.15); border-radius: 14px; padding: 16px; }
    .jwt-box h3 { font-size: 12px; color: #94a3b8; text-transform: uppercase; margin-bottom: 10px; letter-spacing: 0.5px; }
    .jwt-box pre { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; color: #fed7aa; white-space: pre-wrap; word-break: break-word; }
    .jwt-box.header pre { color: #f472b6; }
    .jwt-box.payload pre { color: #86efac; }
  </style>
</head>
<body class="lt-body modo-terminal">
  <a class="lt-back" href="/devdata" title="Voltar para Dev/Data" aria-label="Voltar para Dev/Data">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M19 12H5M5 12L12 19M5 12L12 5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </a>

  <div class="topo"><a class="lt-brand" href="/"><span>LOCALTOOLS</span></a></div>
  <header class="modo-cab modo-cab-ferramenta">
    <nav class="modo-trilha" aria-label="Você está em"><a href="/devdata">Dev/Data</a> / Encode / Decode</nav>
    <h1 class="modo-titulo">Encode / Decode</h1>
    <p class="modo-sub">Base64 · JWT · URL Encode · HTML Entities — processado localmente</p>
  </header>

  <div class="card">
    <div class="tabs">
      <div class="tab active" data-mode="base64" onclick="setMode('base64')">Base64</div>
      <div class="tab" data-mode="jwt" onclick="setMode('jwt')">JWT</div>
      <div class="tab" data-mode="url" onclick="setMode('url')">URL Encode</div>
      <div class="tab" data-mode="html" onclick="setMode('html')">HTML Entities</div>
    </div>

    <div class="toolbar" id="toolbar-standard">
      <button class="action btn-primary" onclick="encodeText()">Codificar</button>
      <button class="action btn-primary" onclick="decodeText()">Decodificar</button>
      <button class="action btn-secondary" onclick="copyOutput()">Copiar saída</button>
      <button class="action btn-secondary" onclick="clearAll()">Limpar</button>
    </div>

    <div class="toolbar" id="toolbar-jwt" style="display:none;">
      <button class="action btn-primary" onclick="decodeJWT()">Decodificar token</button>
      <button class="action btn-secondary" onclick="clearAll()">Limpar</button>
    </div>

    <div class="panes" id="standard-panes">
      <div>
        <div class="pane-label">Entrada</div>
        <textarea id="input" placeholder="Digite ou cole o texto..." spellcheck="false"></textarea>
      </div>
      <div>
        <div class="pane-label">Saída</div>
        <textarea id="output" placeholder="O resultado aparece aqui..." spellcheck="false"></textarea>
      </div>
    </div>

    <div id="jwt-input-wrap" style="display:none;">
      <div class="pane-label">Token JWT</div>
      <textarea id="jwt-input" placeholder="Cole o token JWT (xxxxx.yyyyy.zzzzz)..." spellcheck="false" style="height:120px;"></textarea>
    </div>

    <div class="jwt-panels" id="jwt-panels">
      <div class="jwt-box header">
        <h3>Header</h3>
        <pre id="jwt-header"></pre>
      </div>
      <div class="jwt-box payload">
        <h3>Payload</h3>
        <pre id="jwt-payload"></pre>
      </div>
    </div>

    <div class="error-box" id="error-box"></div>
  </div>

  <script>
    let currentMode = 'base64';

    function setMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.mode === mode));
      hideError();
      const isJwt = mode === 'jwt';
      document.getElementById('toolbar-standard').style.display = isJwt ? 'none' : 'flex';
      document.getElementById('toolbar-jwt').style.display = isJwt ? 'flex' : 'none';
      document.getElementById('standard-panes').style.display = isJwt ? 'none' : 'grid';
      document.getElementById('jwt-input-wrap').style.display = isJwt ? 'block' : 'none';
      document.getElementById('jwt-panels').classList.toggle('show', false);
    }

    function showError(msg) {
      const box = document.getElementById('error-box');
      box.textContent = '' + msg;
      box.classList.add('show');
    }
    function hideError() { document.getElementById('error-box').classList.remove('show'); }

    function utf8ToB64(str) { return btoa(unescape(encodeURIComponent(str))); }
    function b64ToUtf8(str) { return decodeURIComponent(escape(atob(str))); }

    function encodeText() {
      hideError();
      const input = document.getElementById('input').value;
      try {
        let out = '';
        if (currentMode === 'base64') out = utf8ToB64(input);
        else if (currentMode === 'url') out = encodeURIComponent(input);
        else if (currentMode === 'html') out = input.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
        document.getElementById('output').value = out;
      } catch (e) { showError('Erro ao codificar: ' + e.message); }
    }

    function decodeText() {
      hideError();
      const input = document.getElementById('input').value;
      try {
        let out = '';
        if (currentMode === 'base64') out = b64ToUtf8(input.trim());
        else if (currentMode === 'url') out = decodeURIComponent(input);
        else if (currentMode === 'html') {
          const el = document.createElement('textarea');
          el.innerHTML = input;
          out = el.value;
        }
        document.getElementById('output').value = out;
      } catch (e) { showError('Erro ao decodificar: ' + e.message); }
    }

    function base64UrlDecode(str) {
      str = str.replace(/-/g, '+').replace(/_/g, '/');
      while (str.length % 4) str += '=';
      return b64ToUtf8(str);
    }

    function decodeJWT() {
      hideError();
      const token = document.getElementById('jwt-input').value.trim();
      const parts = token.split('.');
      if (parts.length < 2) { showError('Token JWT inválido — esperado formato header.payload.assinatura'); return; }
      try {
        const header = JSON.parse(base64UrlDecode(parts[0]));
        const payload = JSON.parse(base64UrlDecode(parts[1]));
        document.getElementById('jwt-header').textContent = JSON.stringify(header, null, 2);
        document.getElementById('jwt-payload').textContent = JSON.stringify(payload, null, 2);
        document.getElementById('jwt-panels').classList.add('show');
      } catch (e) {
        showError('Não foi possível decodificar o token: ' + e.message);
      }
    }

    function copyOutput() {
      const out = document.getElementById('output');
      if (out.value) navigator.clipboard.writeText(out.value);
    }

    function clearAll() {
      document.getElementById('input').value = '';
      document.getElementById('output').value = '';
      document.getElementById('jwt-input').value = '';
      document.getElementById('jwt-panels').classList.remove('show');
      hideError();
    }
  </script>
</body>
</html>
