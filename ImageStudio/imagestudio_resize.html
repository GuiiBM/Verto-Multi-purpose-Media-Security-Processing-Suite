<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crop & Resize em Massa</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0a0f1e;
      background-image: radial-gradient(at 0% 0%, rgba(168, 85, 247, 0.08) 0px, transparent 50%);
      color: #e2e8f0;
      min-height: 100vh;
      padding: 40px 15px;
      padding-top: 100px;
    }
    .back-button {
      position: fixed; top: 24px; left: 24px; width: 56px; height: 56px;
      background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(40px);
      border-radius: 16px; border: 1.5px solid rgba(148, 163, 184, 0.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.3s; z-index: 1000; color: #cbd5e1;
    }
    .back-button:hover { border-color: rgba(168, 85, 247, 0.4); color: #a855f7; transform: translateX(-6px); }
    .back-button.locked { pointer-events: none; opacity: 0.4; }
    .logo {
      font-size: 42px; font-weight: 900;
      background: linear-gradient(135deg, #a855f7 0%, #ec4899 50%, #3b82f6 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      text-align: center; margin-bottom: 10px;
    }
    .tagline { color: #64748b; font-size: 14px; margin-bottom: 20px; text-align: center; }
    .mode-toggle { display: flex; gap: 8px; justify-content: center; margin-bottom: 28px; }
    .mode-btn {
      padding: 10px 22px; border-radius: 999px; border: 1px solid rgba(148, 163, 184, 0.2);
      background: rgba(15, 23, 42, 0.6); color: #94a3b8; cursor: pointer; font-size: 13px; font-weight: 700; transition: all 0.2s;
    }
    .mode-btn.active { border-color: #a855f7; background: rgba(168, 85, 247, 0.15); color: #d8b4fe; box-shadow: 0 0 16px rgba(168, 85, 247, 0.2); }
    .layout { display: grid; grid-template-columns: 320px 1fr; gap: 20px; max-width: 1350px; margin: 0 auto; align-items: start; }
    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
    .card {
      background: rgba(15, 23, 42, 0.4); border-radius: 24px; padding: 26px;
      border: 1px solid rgba(148, 163, 184, 0.08); backdrop-filter: blur(40px);
    }
    h2 { font-size: 15px; color: #f8fafc; margin-bottom: 16px; }
    label.small { display: block; font-size: 12px; font-weight: 600; color: #94a3b8; margin-bottom: 8px; margin-top: 16px; }
    label.small:first-child { margin-top: 0; }
    input[type="number"], select {
      width: 100%; padding: 10px 12px; border-radius: 10px;
      background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(148, 163, 184, 0.2);
      color: #e2e8f0; font-family: 'Inter', sans-serif; font-size: 13px;
    }
    .ratio-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .ratio-btn {
      padding: 10px 6px; border-radius: 10px; border: 1px solid rgba(148, 163, 184, 0.2);
      background: rgba(15, 23, 42, 0.6); color: #94a3b8; cursor: pointer;
      text-align: center; font-size: 12px; font-weight: 600; transition: all 0.2s;
    }
    .ratio-btn.active { border-color: #a855f7; background: rgba(168, 85, 247, 0.15); color: #d8b4fe; }
    .dims-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .fit-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .fit-btn {
      padding: 8px 4px; border-radius: 10px; border: 1px solid rgba(148, 163, 184, 0.2);
      background: rgba(15, 23, 42, 0.6); color: #94a3b8; cursor: pointer;
      text-align: center; font-size: 11px; font-weight: 600;
    }
    .fit-btn.active { border-color: #a855f7; background: rgba(168, 85, 247, 0.15); color: #d8b4fe; }
    .range-row { display: flex; align-items: center; gap: 10px; }
    input[type="range"] { flex: 1; accent-color: #a855f7; }
    .range-val { font-size: 12px; color: #cbd5e1; min-width: 32px; text-align: right; }
    .upload-area {
      margin-top: 20px; padding: 24px; border-radius: 14px;
      border: 2px dashed rgba(168, 85, 247, 0.3); background: rgba(15, 23, 42, 0.6);
      text-align: center; cursor: pointer; transition: all 0.3s;
    }
    .upload-area:hover, .upload-area.dragover { border-color: #a855f7; background: rgba(168, 85, 247, 0.08); }
    .upload-icon { font-size: 36px; margin-bottom: 10px; }
    .upload-text { color: #cbd5e1; font-size: 13px; }
    input[type="file"] { display: none; }
    button.action {
      width: 100%; padding: 13px; border-radius: 10px; border: none; cursor: pointer;
      font-size: 14px; font-weight: 700; background: linear-gradient(135deg, #a855f7, #ec4899);
      color: white; transition: all 0.25s; margin-top: 20px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    button.action:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(168, 85, 247, 0.35); }
    button.action:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary {
      width: 100%; margin-top: 10px; padding: 11px; border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: 700;
      background: rgba(148, 163, 184, 0.12); color: #cbd5e1; border: 1px solid rgba(148, 163, 184, 0.2);
    }
    .btn-secondary:hover { background: rgba(148, 163, 184, 0.2); }
    .preview-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .count-badge { font-size: 12px; color: #64748b; }
    .grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px;
      max-height: 680px; overflow-y: auto; padding-right: 4px;
    }
    .thumb {
      position: relative; border-radius: 12px; overflow: hidden; border: 1px solid rgba(148, 163, 184, 0.15);
      background: rgba(6, 10, 22, 0.8); aspect-ratio: 1;
    }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .thumb .remove {
      position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border-radius: 50%;
      background: rgba(0,0,0,0.6); color: #fca5a5; display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 12px; font-weight: 700;
    }
    .thumb .name { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.65); font-size: 9px; padding: 3px 5px; color: #cbd5e1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .empty-state { text-align: center; color: #64748b; font-size: 13px; padding: 80px 20px; }
    .status { margin-top: 16px; font-size: 13px; padding: 14px; border-radius: 12px; display: none; }
    .status.show { display: block; }
    .status.ok { background: rgba(34, 197, 94, 0.1); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); }
    .status.err { background: rgba(239, 68, 68, 0.1); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
  </style>
</head>
<body>
  <div class="back-button" id="back-button" onclick="if(!busy) location.href='/imagestudio'">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M19 12H5M5 12L12 19M5 12L12 5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <div class="logo">✂️ Crop & Resize</div>
  <div class="tagline">Proporções prontas ou dimensões exatas</div>
  <div class="mode-toggle">
    <div class="mode-btn active" data-mode="batch" onclick="setMode('batch')">🗂️ Em lote (até 100 → ZIP)</div>
    <div class="mode-btn" data-mode="individual" onclick="setMode('individual')">🖼️ Individual (1 imagem → download direto)</div>
  </div>

  <div class="layout">
    <div class="card">
      <h2>Proporção</h2>
      <div class="ratio-grid">
        <div class="ratio-btn active" data-ratio="free" onclick="setRatio('free')">Livre</div>
        <div class="ratio-btn" data-ratio="1:1" onclick="setRatio('1:1')">1:1</div>
        <div class="ratio-btn" data-ratio="16:9" onclick="setRatio('16:9')">16:9</div>
        <div class="ratio-btn" data-ratio="4:3" onclick="setRatio('4:3')">4:3</div>
        <div class="ratio-btn" data-ratio="3:2" onclick="setRatio('3:2')">3:2</div>
        <div class="ratio-btn" data-ratio="9:16" onclick="setRatio('9:16')">9:16</div>
      </div>

      <label class="small">Dimensões exatas de saída (px)</label>
      <div class="dims-row">
        <input type="number" id="out-width" placeholder="Largura" value="1080">
        <input type="number" id="out-height" placeholder="Altura" value="1080">
      </div>

      <label class="small">Modo de encaixe</label>
      <div class="fit-grid">
        <div class="fit-btn active" data-fit="cover" onclick="setFit('cover')">Cover</div>
        <div class="fit-btn" data-fit="contain" onclick="setFit('contain')">Contain</div>
        <div class="fit-btn" data-fit="stretch" onclick="setFit('stretch')">Esticar</div>
      </div>

      <label class="small">Formato de saída</label>
      <select id="out-format">
        <option value="image/jpeg">JPG</option>
        <option value="image/png">PNG</option>
        <option value="image/webp">WEBP</option>
      </select>

      <label class="small">Qualidade</label>
      <div class="range-row">
        <input type="range" id="quality" min="10" max="100" value="88">
        <span class="range-val" id="quality-val">88%</span>
      </div>

      <div class="upload-area" id="upload-area" onclick="document.getElementById('file-input').click()">
        <div class="upload-icon">📁</div>
        <div class="upload-text" id="upload-text">Clique ou arraste até 100 imagens</div>
      </div>
      <input type="file" id="file-input" accept="image/*" multiple>

      <button class="action" id="process-btn" onclick="processAll()" disabled>✂️ Processar e baixar ZIP</button>
      <button class="btn-secondary" onclick="clearImages()">🗑️ Limpar tudo</button>

      <div class="status" id="status"></div>
    </div>

    <div class="card">
      <div class="preview-header">
        <h2 style="margin:0;">Imagens</h2>
        <span class="count-badge" id="count-badge">0 / 100</span>
      </div>
      <div class="grid" id="grid">
        <div class="empty-state" id="empty-state">Nenhuma imagem carregada ainda</div>
      </div>
    </div>
  </div>

  <script>
    let busy = false;
    let mode = 'batch'; // 'batch' | 'individual'
    let currentRatio = 'free';
    let currentFit = 'cover';
    let images = []; // { file, url, id }
    let idCounter = 0;

    const fileInput = document.getElementById('file-input');
    const uploadArea = document.getElementById('upload-area');
    const uploadText = document.getElementById('upload-text');
    const grid = document.getElementById('grid');
    const emptyState = document.getElementById('empty-state');
    const countBadge = document.getElementById('count-badge');
    const processBtn = document.getElementById('process-btn');
    const statusBox = document.getElementById('status');
    const backButton = document.getElementById('back-button');

    function setMode(m) {
      if (busy) return;
      mode = m;
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === m));
      uploadText.textContent = m === 'individual' ? 'Clique ou arraste 1 imagem' : 'Clique ou arraste até 100 imagens';
      if (m === 'individual' && images.length > 1) {
        images.slice(1).forEach(img => URL.revokeObjectURL(img.url));
        images = images.slice(0, 1);
      }
      renderGrid();
    }

    document.getElementById('quality').addEventListener('input', e => {
      document.getElementById('quality-val').textContent = e.target.value + '%';
    });

    function setRatio(r) {
      currentRatio = r;
      document.querySelectorAll('.ratio-btn').forEach(b => b.classList.toggle('active', b.dataset.ratio === r));
      if (r !== 'free') {
        const [w, h] = r.split(':').map(Number);
        const baseW = parseInt(document.getElementById('out-width').value) || 1080;
        document.getElementById('out-height').value = Math.round(baseW * h / w);
      }
    }

    function setFit(f) {
      currentFit = f;
      document.querySelectorAll('.fit-btn').forEach(b => b.classList.toggle('active', b.dataset.fit === f));
    }

    function addFiles(fileList) {
      const files = Array.from(fileList).filter(f => f.type.startsWith('image/'));
      if (!files.length) return;
      if (mode === 'individual') {
        images.forEach(img => URL.revokeObjectURL(img.url));
        images = [];
        const file = files[0];
        images.push({ file, url: URL.createObjectURL(file), id: idCounter++ });
      } else {
        const remaining = 100 - images.length;
        files.slice(0, remaining).forEach(file => {
          images.push({ file, url: URL.createObjectURL(file), id: idCounter++ });
        });
      }
      renderGrid();
    }

    fileInput.addEventListener('change', e => addFiles(e.target.files));
    uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.classList.add('dragover'); });
    uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
    uploadArea.addEventListener('drop', e => {
      e.preventDefault();
      uploadArea.classList.remove('dragover');
      if (busy) return;
      addFiles(e.dataTransfer.files);
    });

    function removeImage(id) {
      images = images.filter(img => img.id !== id);
      renderGrid();
    }

    function renderGrid() {
      countBadge.textContent = mode === 'individual' ? `${images.length} / 1` : `${images.length} / 100`;
      processBtn.disabled = images.length === 0;
      processBtn.textContent = mode === 'individual' ? '✂️ Baixar imagem' : '✂️ Processar e baixar ZIP';
      if (!images.length) {
        grid.innerHTML = '';
        grid.appendChild(emptyState);
        return;
      }
      grid.innerHTML = images.map(img => `
        <div class="thumb">
          <img src="${img.url}">
          <div class="remove" onclick="removeImage(${img.id})">✕</div>
          <div class="name">${img.file.name}</div>
        </div>
      `).join('');
    }

    function clearImages() {
      images.forEach(img => URL.revokeObjectURL(img.url));
      images = [];
      renderGrid();
      statusBox.classList.remove('show');
    }

    function loadImageEl(url) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = url;
      });
    }

    function drawResized(img, targetW, targetH, fit) {
      const canvas = document.createElement('canvas');
      canvas.width = targetW;
      canvas.height = targetH;
      const ctx = canvas.getContext('2d');
      const srcW = img.naturalWidth, srcH = img.naturalHeight;

      if (fit === 'stretch') {
        ctx.drawImage(img, 0, 0, targetW, targetH);
      } else if (fit === 'contain') {
        const scale = Math.min(targetW / srcW, targetH / srcH);
        const w = srcW * scale, h = srcH * scale;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, targetW, targetH);
        ctx.drawImage(img, (targetW - w) / 2, (targetH - h) / 2, w, h);
      } else {
        const scale = Math.max(targetW / srcW, targetH / srcH);
        const w = srcW * scale, h = srcH * scale;
        ctx.drawImage(img, (targetW - w) / 2, (targetH - h) / 2, w, h);
      }
      return canvas;
    }

    function canvasToBlob(canvas, type, quality) {
      return new Promise(resolve => canvas.toBlob(resolve, type, quality));
    }

    function setLocked(locked) {
      busy = locked;
      processBtn.disabled = locked || images.length === 0;
      backButton.classList.toggle('locked', locked);
    }

    function showResult(ok, message) {
      statusBox.className = 'status show ' + (ok ? 'ok' : 'err');
      statusBox.textContent = (ok ? '✅ ' : '❌ ') + message;
    }

    async function processAll() {
      if (busy || !images.length) return;
      if (mode === 'individual') return processIndividual();

      setLocked(true);
      processBtn.textContent = 'Processando...';

      const targetW = parseInt(document.getElementById('out-width').value) || 1080;
      const targetH = parseInt(document.getElementById('out-height').value) || 1080;
      const format = document.getElementById('out-format').value;
      const quality = parseInt(document.getElementById('quality').value) / 100;
      const ext = { 'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp' }[format];

      try {
        const zip = new JSZip();
        const usedNames = new Set();
        for (let i = 0; i < images.length; i++) {
          const item = images[i];
          const imgEl = await loadImageEl(item.url);
          const canvas = drawResized(imgEl, targetW, targetH, currentFit);
          const blob = await canvasToBlob(canvas, format, quality);
          let base = item.file.name.replace(/\.[^.]+$/, '');
          let name = `${base}.${ext}`;
          let n = 1;
          while (usedNames.has(name)) { name = `${base}_${n++}.${ext}`; }
          usedNames.add(name);
          zip.file(name, blob);
        }
        const zipBlob = await zip.generateAsync({ type: 'blob' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(zipBlob);
        a.download = 'imagens-redimensionadas.zip';
        a.click();
        showResult(true, `${images.length} imagem(ns) processada(s) e baixada(s) em ZIP!`);
      } catch (e) {
        showResult(false, 'Erro ao processar: ' + e.message);
      } finally {
        setLocked(false);
        processBtn.textContent = '✂️ Processar e baixar ZIP';
      }
    }

    async function processIndividual() {
      setLocked(true);
      processBtn.textContent = 'Processando...';

      const targetW = parseInt(document.getElementById('out-width').value) || 1080;
      const targetH = parseInt(document.getElementById('out-height').value) || 1080;
      const format = document.getElementById('out-format').value;
      const quality = parseInt(document.getElementById('quality').value) / 100;
      const ext = { 'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp' }[format];

      try {
        const item = images[0];
        const imgEl = await loadImageEl(item.url);
        const canvas = drawResized(imgEl, targetW, targetH, currentFit);
        const blob = await canvasToBlob(canvas, format, quality);
        const base = item.file.name.replace(/\.[^.]+$/, '');
        const name = `${base}-redimensionada.${ext}`;
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = name;
        a.click();
        showResult(true, `'${name}' baixada — arquivo único, sem ZIP.`);
      } catch (e) {
        showResult(false, 'Erro ao processar: ' + e.message);
      } finally {
        setLocked(false);
        processBtn.textContent = '✂️ Baixar imagem';
      }
    }
  </script>
</body>
</html>
