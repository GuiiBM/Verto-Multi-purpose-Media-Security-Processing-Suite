<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            background: #0a0f1e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .logo-container {
            text-align: center;
        }
        .logo {
            width: 280px;
            height: 100px;
        }
        .logo svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 20px rgba(34, 197, 94, 0.6));
        }
    </style>
</head>
<body>
    <div class="logo-container">
        <div class="logo">
            <svg viewBox="0 0 280 100" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#22c55e"/>
                        <stop offset="50%" style="stop-color:#16a34a"/>
                        <stop offset="100%" style="stop-color:#3b82f6"/>
                    </linearGradient>
                    <linearGradient id="shapeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#22c55e;stop-opacity:0.9"/>
                        <stop offset="100%" style="stop-color:#16a34a;stop-opacity:0.9"/>
                    </linearGradient>
                </defs>
                <path d="M 10 20 L 25 50 L 10 80" stroke="url(#shapeGrad)" stroke-width="4" stroke-linecap="round" fill="none"/>
                <path d="M 25 50 L 40 20 L 40 80 Z" fill="url(#shapeGrad)"/>
                <text x="55" y="70" font-family="Inter, sans-serif" font-size="52" font-weight="900" fill="url(#textGrad)" letter-spacing="8">VERTO</text>
            </svg>
        </div>
    </div>
</body>
</html>
