<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a34a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:0.8" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#grad2)" stroke-width="2" opacity="0.3"/>
  <circle cx="100" cy="100" r="75" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.2"/>
  
  <path d="M 60 60 L 100 100 L 60 140" stroke="url(#grad1)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)"/>
  <path d="M 100 100 L 140 60 L 140 140 L 100 100" fill="url(#grad1)" opacity="0.9" filter="url(#glow)"/>
  
  <circle cx="100" cy="100" r="8" fill="#22c55e" filter="url(#glow)"/>
  <circle cx="60" cy="60" r="5" fill="#3b82f6" opacity="0.8"/>
  <circle cx="60" cy="140" r="5" fill="#3b82f6" opacity="0.8"/>
  <circle cx="140" cy="60" r="5" fill="#22c55e" opacity="0.9"/>
  <circle cx="140" cy="140" r="5" fill="#22c55e" opacity="0.9"/>
</svg>
