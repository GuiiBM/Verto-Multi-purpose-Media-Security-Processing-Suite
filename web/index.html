<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verto - Professional Media Converter</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #0a0f1e;
            background-image: 
                radial-gradient(at 0% 0%, rgba(34, 197, 94, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(59, 130, 246, 0.06) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.05) 0px, transparent 50%);
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 15px;
            position: relative;
            overflow-x: hidden;
            max-width: 100vw;
        }
        .main-container {
            display: flex;
            gap: 20px;
            width: 95vw;
            max-width: 1200px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            margin: 0 auto;
        }
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(148, 163, 184, 0.03) 2px,
                rgba(148, 163, 184, 0.03) 4px
            );
            animation: grid-move 20s linear infinite;
            pointer-events: none;
        }
        @keyframes grid-move {
            0% { transform: translateY(0); }
            100% { transform: translateY(50px); }
        }
        .logo-container {
            position: relative;
            margin-bottom: 20px;
            padding: 10px 0;
        }
        .logo {
            font-size: 72px;
            font-weight: 900;
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 50%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 18px;
            text-transform: uppercase;
            position: relative;
            filter: drop-shadow(0 0 25px rgba(34, 197, 94, 0.7)) drop-shadow(0 0 50px rgba(59, 130, 246, 0.4));
            animation: glow-pulse 3s ease-in-out infinite;
        }
        @keyframes glow-pulse {
            0%, 100% { filter: drop-shadow(0 0 25px rgba(34, 197, 94, 0.7)) drop-shadow(0 0 50px rgba(59, 130, 246, 0.4)); }
            50% { filter: drop-shadow(0 0 35px rgba(34, 197, 94, 0.9)) drop-shadow(0 0 70px rgba(59, 130, 246, 0.6)); }
        }
        .tagline {
            color: #64748b;
            font-size: 15px;
            margin-bottom: 48px;
            font-weight: 500;
            letter-spacing: 0.5px;
            position: relative;
            z-index: 1;
        }
        .card {
            background: rgba(15, 23, 42, 0.4);
            border-radius: 28px;
            padding: 40px;
            box-shadow: 
                0 0 0 1px rgba(148, 163, 184, 0.1),
                0 20px 60px rgba(0, 0, 0, 0.6),
                0 0 80px rgba(34, 197, 94, 0.05);
            width: 100%;
            max-width: 520px;
            border: 1px solid rgba(148, 163, 184, 0.08);
            backdrop-filter: blur(40px) saturate(180%);
            position: relative;
            z-index: 1;
            box-sizing: border-box;
            flex: 1 1 auto;
            min-width: 320px;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
        }
        h1 {
            margin: 0 0 10px;
            font-size: 28px;
            font-weight: 700;
            color: #f8fafc;
            letter-spacing: -0.5px;
        }
        p.subtitle {
            margin: 0 0 32px;
            font-size: 14px;
            color: #94a3b8;
            font-weight: 400;
            line-height: 1.6;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #cbd5e1;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            font-size: 11px;
        }
        input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            border-radius: 14px;
            border: 1.5px solid rgba(148, 163, 184, 0.15);
            background: rgba(15, 23, 42, 0.6);
            color: #f1f5f9;
            font-size: 14px;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: inherit;
        }
        input[type="text"]:hover {
            border-color: rgba(148, 163, 184, 0.25);
            background: rgba(15, 23, 42, 0.7);
        }
        input[type="text"]:focus {
            border-color: #22c55e;
            background: rgba(15, 23, 42, 0.8);
            box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.08), 0 0 20px rgba(34, 197, 94, 0.1);
        }
        select {
            width: 100%;
            padding: 14px 16px;
            border-radius: 14px;
            border: 1.5px solid rgba(148, 163, 184, 0.15);
            background: rgba(15, 23, 42, 0.6);
            color: #f1f5f9;
            font-size: 14px;
            outline: none;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: inherit;
        }
        select:hover {
            border-color: rgba(148, 163, 184, 0.25);
            background: rgba(15, 23, 42, 0.7);
        }
        select:focus {
            border-color: #22c55e;
            background: rgba(15, 23, 42, 0.8);
            box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.08);
        }
        button {
            margin-top: 28px;
            width: 100%;
            border: none;
            border-radius: 14px;
            padding: 16px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 16px rgba(34, 197, 94, 0.3), 0 0 0 1px rgba(34, 197, 94, 0.2);
            position: relative;
            overflow: hidden;
        }
        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }
        button:hover::before {
            left: 100%;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(34, 197, 94, 0.4), 0 0 0 1px rgba(34, 197, 94, 0.3);
        }
        button:active {
            transform: translateY(0);
        }
        button:disabled {
            opacity: 0.6;
            cursor: default;
        }
        .status {
            margin-top: 10px;
            font-size: 12px;
            color: #9ca3af;
            min-height: 18px;
        }
        .status.ok {
            color: #4ade80;
        }
        .status.err {
            color: #f97373;
        }
        .spinner {
            width: 14px;
            height: 14px;
            border-radius: 999px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            animation: spin 0.7s linear infinite;
            display: none;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .download-link {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 16px;
            background: #3b82f6;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 12px;
        }
        .preview {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
            width: 100%;
        }
        .preview-loading {
            text-align: center;
            padding: 20px;
            color: #9ca3af;
            font-size: 12px;
        }
        #preview-content {
            display: flex;
            flex-direction: column;
            height: 100%;
            justify-content: space-between;
        }
        .preview-info {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        .preview-card {
            background: rgba(15, 23, 42, 0.4);
            border-radius: 28px;
            padding: 24px;
            box-shadow: 
                0 0 0 1px rgba(148, 163, 184, 0.1),
                0 20px 60px rgba(0, 0, 0, 0.6),
                0 0 80px rgba(34, 197, 94, 0.05);
            width: 100%;
            max-width: 520px;
            border: 1px solid rgba(148, 163, 184, 0.08);
            backdrop-filter: blur(40px) saturate(180%);
            position: relative;
            z-index: 1;
            box-sizing: border-box;
            flex: 0 1 auto;
            min-width: 320px;
            display: none;
            flex-direction: column;
        }
        .preview-card.show {
            display: flex !important;
        }
        .preview.show {
            display: block;
        }
        .preview img {
            width: 100%;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s;
            flex-shrink: 0;
        }
        .preview img:hover {
            opacity: 0.8;
        }
        .preview img.image-format {
            cursor: zoom-in;
        }
        .preview img.image-format:hover {
            opacity: 1;
            transform: scale(1.02);
        }
        .preview iframe {
            width: 100%;
            aspect-ratio: 16 / 9;
            height: auto;
            border-radius: 12px;
            border: none;
            flex-shrink: 0;
        }
        .preview h3 {
            margin: 0 0 6px;
            font-size: 14px;
            color: #e5e7eb;
        }
        .preview p {
            margin: 0;
            font-size: 12px;
            color: #9ca3af;
        }
        .preview-loading {
            text-align: center;
            padding: 20px;
            color: #9ca3af;
            font-size: 12px;
        }
        .format-selector {
            display: flex;
            gap: 12px;
            margin-bottom: 40px;
            justify-content: center;
            flex-wrap: wrap;
            position: relative;
            z-index: 1;
            max-width: 95vw;
        }
        .format-btn {
            padding: 14px 28px;
            border-radius: 14px;
            border: 1.5px solid rgba(148, 163, 184, 0.12);
            background: rgba(15, 23, 42, 0.4);
            color: #94a3b8;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(20px);
            position: relative;
            overflow: hidden;
        }
        .format-btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(34, 197, 94, 0.1);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }
        .format-btn:hover::after {
            width: 300px;
            height: 300px;
        }
        .format-btn:hover {
            border-color: rgba(34, 197, 94, 0.3);
            background: rgba(15, 23, 42, 0.6);
            color: #cbd5e1;
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }
        .format-btn.active {
            border-color: #22c55e;
            background: rgba(34, 197, 94, 0.12);
            color: #22c55e;
            box-shadow: 0 0 24px rgba(34, 197, 94, 0.2), 0 4px 12px rgba(0, 0, 0, 0.3);
        }
        .format-btn span {
            position: relative;
            z-index: 1;
        }
        .image-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            cursor: zoom-out;
        }
        .image-modal img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 8px;
        }
        @media (max-width: 640px) {
            body { padding: 30px 10px; }
            .logo { font-size: 48px; letter-spacing: 12px; }
            .tagline { font-size: 13px; margin-bottom: 32px; }
            .format-selector { gap: 8px; margin-bottom: 32px; max-width: 98vw; }
            .format-btn { padding: 12px 20px; font-size: 13px; }
            .card { padding: 24px 16px; border-radius: 20px; width: auto; max-width: 95vw; flex: 0 1 auto; }
            .preview-card { padding: 16px; width: auto; max-width: 95vw; flex: 0 1 auto; }
            h1 { font-size: 24px; }
            p.subtitle { font-size: 13px; margin-bottom: 24px; }
            .preview iframe { height: 180px; }
            .main-container { flex-direction: column; align-items: center; }
        }
        @media (min-width: 641px) and (max-width: 1024px) {
            .main-container { flex-direction: column; }
        }
        @media (min-width: 1025px) {
            .logo { font-size: 80px; letter-spacing: 20px; }
            .main-container { flex-direction: row; }
        }
        @media (max-width: 480px) {
            body { padding: 20px 8px; }
            .logo { font-size: 40px; letter-spacing: 8px; }
            .format-btn { padding: 10px 14px; font-size: 12px; }
            .card { padding: 20px 12px; width: auto; max-width: 95vw; }
            .preview-card { padding: 12px; width: auto; max-width: 95vw; }
            h1 { font-size: 22px; }
            input[type="text"], select { padding: 12px 14px; font-size: 13px; }
            button { padding: 14px; font-size: 14px; }
            .preview iframe { height: 160px; }
        }
        @media (min-width: 768px) and (max-width: 1024px) {
            .logo { font-size: 64px; letter-spacing: 16px; }
            .card { padding: 36px; }
            .preview-card { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="logo-container">
        <div class="logo">VERTO</div>
    </div>
    <div class="tagline">Professional Media Converter</div>
    
    <div class="format-selector">
        <div class="format-btn active" data-format="mp4"><span>🎬 MP4</span></div>
        <div class="format-btn" data-format="mp3"><span>🎵 MP3</span></div>
        <div class="format-btn" data-format="thumbnail"><span>🖼️ PNG</span></div>
        <div class="format-btn" data-format="jpg"><span>🖼️ JPG</span></div>
    </div>

    <div class="main-container">
        <div class="card">
            <h1>Convert Media</h1>
            <p class="subtitle">Paste YouTube URL and select your preferred format</p>

            <form id="download-form">
                <label for="url">Video URL</label>
                <input type="text" id="url" name="url" placeholder="https://www.youtube.com/watch?v=..." required>
                
                <label for="quality" style="margin-top: 16px;" id="quality-label">Quality</label>
                <select id="quality" name="quality">
                    <option value="best">🔥 Melhor qualidade disponível</option>
                    <option value="1080p">📺 1080p (Full HD)</option>
                    <option value="720p">📱 720p (HD)</option>
                    <option value="480p">💻 480p (SD)</option>
                    <option value="360p">📞 360p (Baixa)</option>
                </select>

                <button type="submit" id="download-button">
                    <span class="btn-text">⬇️ Download</span>
                    <span class="spinner" id="btn-spinner"></span>
                </button>
            </form>

            <div class="status" id="status">Ready to convert</div>
        </div>

        <div class="preview-card" id="preview-card">
            <div class="preview" id="preview">
                <div class="preview-loading" id="preview-loading">Carregando preview...</div>
                <div id="preview-content" style="display: none;">
                    <img id="preview-thumb" src="" alt="Thumbnail" onclick="playVideo()">
                    <div id="preview-player" style="display: none;"></div>
                    <div class="preview-info">
                        <h3 id="preview-title"></h3>
                        <p id="preview-duration"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="image-modal" id="image-modal" onclick="closeImageModal()">
        <img id="modal-image" src="" alt="">
    </div>

    <script src="app.js"></script>
</body>
</html>
