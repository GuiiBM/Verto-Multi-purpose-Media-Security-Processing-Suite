<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proteger PDF</title>
  <meta name="theme-color" content="#0b0c0f">
  <link rel="icon" type="image/svg+xml" href="/static/localtools/verto.svg">
  <link rel="stylesheet" href="/static/localtools/base.css">
  <link rel="stylesheet" href="/static/localtools/app.css">
  <link rel="stylesheet" href="/static/localtools/pdfs-papel.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--lt-sans);
      background: #0b0c0f;
      background-image: radial-gradient(at 0% 0%, rgba(217, 83, 79, 0.08) 0px, transparent 50%);
      color: #e2e8f0;
      min-height: 100vh;
      padding: 40px 15px;
      padding-top: 100px;
    }
    .back-button {
      position: fixed;
      top: 24px;
      left: 24px;
      width: 56px;
      height: 56px;
      background: rgba(24, 26, 31, 0.8);
      backdrop-filter: blur(40px);
      border-radius: 16px;
      border: 1.5px solid rgba(148, 163, 184, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s;
      z-index: 1000;
      color: #cbd5e1;
    }
    .back-button:hover {
      border-color: rgba(217, 83, 79, 0.4);
      color: #d9534f;
      transform: translateX(-6px);
    }
    .logo {
      font-size: 48px;
      font-weight: 900;
      background: linear-gradient(135deg, #d9534f 0%, #c2413d 50%, #a8332f 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
      margin-bottom: 10px;
    }
    .tagline {
      color: #64748b;
      font-size: 15px;
      margin-bottom: 40px;
      text-align: center;
    }
    .card {
      background: rgba(24, 26, 31, 0.4);
      border-radius: 28px;
      padding: 40px;
      border: 1px solid rgba(148, 163, 184, 0.08);
      backdrop-filter: blur(40px);
      max-width: 600px;
      margin: 0 auto;
    }
    h1 {
      font-size: 28px;
      color: #f8fafc;
      margin-bottom: 10px;
    }
    p.subtitle {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 32px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #cbd5e1;
    }
    input[type="file"] {
      display: none;
    }
    input[type="password"], input[type="text"] {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.2);
      background: rgba(24, 26, 31, 0.8);
      color: #f1f5f9;
      font-size: 14px;
      margin-bottom: 16px;
    }
    .file-upload-area {
      width: 100%;
      padding: 40px;
      border-radius: 12px;
      border: 2px dashed rgba(217, 83, 79, 0.3);
      background: rgba(24, 26, 31, 0.6);
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      margin-bottom: 24px;
    }
    .file-upload-area:hover {
      border-color: rgba(217, 83, 79, 0.5);
      background: rgba(24, 26, 31, 0.8);
    }
    .upload-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
    .upload-text {
      color: #cbd5e1;
      font-size: 14px;
      margin-bottom: 8px;
    }
    .upload-hint {
      color: #64748b;
      font-size: 12px;
    }
    button {
      margin-top: 20px;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      background: linear-gradient(135deg, #d9534f, #c2413d);
      color: white;
    }
    .status {
      margin-top: 16px;
      font-size: 13px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
    }
    .status.ok {
      background: rgba(34, 197, 94, 0.1);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }
    .status.err {
      background: rgba(217, 83, 79, 0.1);
      color: #f87171;
      border: 1px solid rgba(217, 83, 79, 0.3);
    }
    .file-selected {
      margin-top: 12px;
      padding: 12px;
      background: rgba(217, 83, 79, 0.1);
      border: 1px solid rgba(217, 83, 79, 0.2);
      border-radius: 8px;
      display: none;
      align-items: center;
      gap: 10px;
    }
    .file-selected.show {
      display: flex;
    }
    .file-selected-icon {
      font-size: 20px;
    }
    .file-selected-name {
      flex: 1;
      font-size: 13px;
      color: #cbd5e1;
      font-weight: 500;
    }
    .file-selected-remove {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(217, 83, 79, 0.2);
      border: 1px solid rgba(217, 83, 79, 0.3);
      color: #d9534f;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.2s;
    }
    .file-selected-remove:hover {
      background: rgba(217, 83, 79, 0.3);
      transform: scale(1.1);
    }
  </style>
</head>
<body class="lt-body pdf-papel">
  <a class="lt-back" href="/pdfs" title="Voltar aos PDFs" aria-label="Voltar aos PDFs">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M19 12H5M5 12L12 19M5 12L12 5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </a>
  
  <div class="topo"><a class="lt-brand" href="/"><span>LOCALTOOLS</span></a></div>
  <header class="pdf-cab">
    <span class="pdf-selo"><svg viewBox="0 0 256 256" aria-hidden="true"><path d="M208,82H174V56a46,46,0,0,0-92,0V82H48A14,14,0,0,0,34,96V208a14,14,0,0,0,14,14H208a14,14,0,0,0,14-14V96A14,14,0,0,0,208,82ZM94,56a34,34,0,0,1,68,0V82H94ZM210,208a2,2,0,0,1-2,2H48a2,2,0,0,1-2-2V96a2,2,0,0,1,2-2H208a2,2,0,0,1,2,2Z"/></svg></span>
    <nav class="pdf-trilha" aria-label="Você está em"><a href="/pdfs">PDFs</a> / Proteger</nav>
    <h1 class="pdf-titulo">Proteger</h1>
    <p class="pdf-sub">Adicione senha ao seu PDF</p>
  </header>
  
  <div class="card">
    <h1>Selecione o PDF</h1>
    <p class="subtitle">Adicione uma senha para proteger seu documento</p>
    
    <form method="POST" enctype="multipart/form-data">
      <label>Arquivo PDF</label>
      <div class="file-upload-area" id="upload-area" onclick="document.getElementById('file').click()">
        <div class="upload-icon"><svg viewBox="0 0 256 256" aria-hidden="true"><path d="M222,152a6,6,0,0,1-6,6H190v20h18a6,6,0,0,1,0,12H190v18a6,6,0,0,1-12,0V152a6,6,0,0,1,6-6h32A6,6,0,0,1,222,152ZM90,172a26,26,0,0,1-26,26H54v10a6,6,0,0,1-12,0V152a6,6,0,0,1,6-6H64A26,26,0,0,1,90,172Zm-12,0a14,14,0,0,0-14-14H54v28H64A14,14,0,0,0,78,172Zm84,8a34,34,0,0,1-34,34H112a6,6,0,0,1-6-6V152a6,6,0,0,1,6-6h16A34,34,0,0,1,162,180Zm-12,0a22,22,0,0,0-22-22H118v44h10A22,22,0,0,0,150,180ZM42,112V40A14,14,0,0,1,56,26h96a6,6,0,0,1,4.25,1.76l56,56A6,6,0,0,1,214,88v24a6,6,0,0,1-12,0V94H152a6,6,0,0,1-6-6V38H56a2,2,0,0,0-2,2v72a6,6,0,0,1-12,0ZM158,82h35.52L158,46.48Z"/></svg></div>
        <div class="upload-text">Clique ou arraste o arquivo aqui</div>
        <div class="upload-hint">Suporta apenas arquivos PDF</div>
      </div>
      <input type="file" id="file" name="file" accept=".pdf" required>
      
      <div class="file-selected" id="file-selected">
        <div class="file-selected-icon"><svg class="traco" viewBox="0 0 256 256" aria-hidden="true"><path d="M212.24,83.76l-56-56A6,6,0,0,0,152,26H56A14,14,0,0,0,42,40V216a14,14,0,0,0,14,14H200a14,14,0,0,0,14-14V88A6,6,0,0,0,212.24,83.76ZM158,46.48,193.52,82H158ZM200,218H56a2,2,0,0,1-2-2V40a2,2,0,0,1,2-2h90V88a6,6,0,0,0,6,6h50V216A2,2,0,0,1,200,218Zm-34-82a6,6,0,0,1-6,6H96a6,6,0,0,1,0-12h64A6,6,0,0,1,166,136Zm0,32a6,6,0,0,1-6,6H96a6,6,0,0,1,0-12h64A6,6,0,0,1,166,168Z"/></svg></div>
        <div class="file-selected-name" id="file-name"></div>
        <div class="file-selected-remove" onclick="clearFile()">×</div>
      </div>
      
      <label>Senha</label>
      <input type="password" name="password" placeholder="Digite a senha" required>
      
      <label>Confirmar Senha</label>
      <input type="password" name="confirm_password" placeholder="Digite a senha novamente" required>
      
      <button type="submit">Proteger PDF</button>
    </form>
    
    {% if status %}
      <div class="status ok">{{ status }}</div>
    {% elif error %}
      <div class="status err">{{ error }}</div>
    {% endif %}
  </div>
  
  <script>
    const fileInput = document.getElementById('file');
    const uploadArea = document.getElementById('upload-area');
    const fileSelected = document.getElementById('file-selected');
    const fileName = document.getElementById('file-name');
    
    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        fileName.textContent = e.target.files[0].name;
        fileSelected.classList.add('show');
      }
    });
    
    uploadArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadArea.style.borderColor = 'rgba(217, 83, 79, 0.5)';
    });
    
    uploadArea.addEventListener('dragleave', () => {
      uploadArea.style.borderColor = 'rgba(217, 83, 79, 0.3)';
    });
    
    uploadArea.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadArea.style.borderColor = 'rgba(217, 83, 79, 0.3)';
      const files = e.dataTransfer.files;
      if (files.length > 0 && files[0].name.endsWith('.pdf')) {
        fileInput.files = files;
        fileName.textContent = files[0].name;
        fileSelected.classList.add('show');
      }
    });
    
    function clearFile() {
      fileInput.value = '';
      fileSelected.classList.remove('show');
    }
  </script>
</body>
</html>
