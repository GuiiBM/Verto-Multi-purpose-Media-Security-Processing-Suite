<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Isolador de Voz - Neural Audio Splitter</title>
  <meta name="theme-color" content="#0b0c0f">
  <link rel="icon" type="image/svg+xml" href="/static/localtools/verto.svg">
  <link rel="stylesheet" href="/static/localtools/base.css">
  <link rel="stylesheet" href="/static/localtools/app.css">
  <link rel="stylesheet" href="/static/localtools/modos/mesa-de-som.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--lt-sans), -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b0c0f;
      background-image: radial-gradient(at 0% 0%, rgba(180, 83, 9, 0.08) 0px, transparent 50%), radial-gradient(at 100% 0%, rgba(168, 85, 247, 0.06) 0px, transparent 50%);
      color: #e2e8f0;
      min-height: 100vh;
      padding: 40px 15px;
    }
    .back-button {
      position: fixed;
      top: 24px;
      left: 24px;
      width: 56px;
      height: 56px;
      background: rgba(24, 26, 31, 0.8);
      backdrop-filter: blur(40px);
      border-radius: 16px;
      border: 1.5px solid rgba(148, 163, 184, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s;
      z-index: 1000;
      color: #cbd5e1;
      box-shadow: 0 0 0 1px rgba(148, 163, 184, 0.1), 0 8px 24px rgba(0, 0, 0, 0.5);
    }
    .back-button:hover {
      background: rgba(24, 26, 31, 0.95);
      border-color: rgba(180, 83, 9, 0.4);
      color: #b45309;
      transform: translateX(-6px);
    }
    .logo {
      font-size: 64px;
      font-weight: 900;
      background: linear-gradient(135deg, #b45309 0%, #92400e 50%, #fbbf24 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 8px;
      text-transform: uppercase;
      filter: drop-shadow(0 0 25px rgba(180, 83, 9, 0.7));
      margin-bottom: 10px;
      text-align: center;
    }
    .tagline {
      color: #64748b;
      font-size: 15px;
      margin-bottom: 48px;
      font-weight: 500;
      text-align: center;
    }
    .container {
      max-width: 700px;
      margin: 0 auto;
    }
    .card {
      background: rgba(24, 26, 31, 0.4);
      border-radius: 28px;
      padding: 32px;
      margin-bottom: 24px;
      border: 1px solid rgba(148, 163, 184, 0.08);
      backdrop-filter: blur(40px);
    }
    h2 {
      font-size: 20px;
      color: #b45309;
      margin-bottom: 20px;
      font-weight: 700;
    }
    .file-input-wrapper {
      margin-bottom: 20px;
    }
    input[type="file"] {
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      border: 2px dashed rgba(148, 163, 184, 0.3);
      background: rgba(24, 26, 31, 0.6);
      color: #cbd5e1;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s;
    }
    input[type="file"]::file-selector-button {
      padding: 12px 28px;
      border: none;
      border-radius: 999px;
      background: linear-gradient(135deg, #b45309, #92400e);
      color: white;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      margin-right: 16px;
      transition: all 0.3s;
      box-shadow: 0 4px 12px rgba(180, 83, 9, 0.2);
    }
    input[type="file"]::file-selector-button:hover {
      background: linear-gradient(135deg, #a16207, #78350f);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(180, 83, 9, 0.3);
    }
    input[type="file"]:hover {
      border-color: rgba(180, 83, 9, 0.5);
      background: rgba(24, 26, 31, 0.8);
      border-style: solid;
    }
    .stem-selector {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }
    .stem-btn {
      flex: 1;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.2);
      background: rgba(24, 26, 31, 0.6);
      color: #cbd5e1;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      text-align: center;
    }
    .stem-btn:hover {
      border-color: rgba(180, 83, 9, 0.5);
      background: rgba(24, 26, 31, 0.8);
    }
    .stem-btn.active {
      border-color: #b45309;
      background: rgba(180, 83, 9, 0.2);
      color: #b45309;
      box-shadow: 0 0 20px rgba(180, 83, 9, 0.3);
    }
    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 999px;
      background: linear-gradient(135deg, #b45309, #92400e);
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 16px rgba(180, 83, 9, 0.2);
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(180, 83, 9, 0.3);
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .status {
      margin-top: 16px;
      font-size: 13px;
      color: #94a3b8;
      text-align: center;
    }
    .status.error {
      color: #ef4444;
    }
    .status.success {
      color: #22c55e;
    }
    .loading {
      display: none;
      text-align: center;
      padding: 20px;
    }
    .loading.show {
      display: block;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(180, 83, 9, 0.2);
      border-top-color: #b45309;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .info-box {
      background: rgba(180, 83, 9, 0.1);
      border: 1px solid rgba(180, 83, 9, 0.3);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
    }
    .info-box p {
      font-size: 13px;
      color: #cbd5e1;
      line-height: 1.6;
      margin: 0;
    }
    @media (max-width: 640px) {
      .logo { font-size: 48px; letter-spacing: 4px; }
      .stem-selector { flex-direction: column; }
    }
  </style>
</head>
<body class="lt-body modo-mesa-de-som">
  <a class="lt-back" href="/" title="Voltar ao menu" aria-label="Voltar ao menu">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M19 12H5M5 12L12 19M5 12L12 5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </a>
  
  <div class="topo"><a class="lt-brand" href="/"><span>LOCALTOOLS</span></a></div>
  <header class="lt-head modo-cab">
    <span class="lt-key lg" style="--hue: var(--lt-cat-audio)"><img src="/static/localtools/apps/isolate.webp" alt="" width="76" height="76"></span>
    <h1 class="modo-titulo">Isolador de Voz</h1>
    <p class="modo-sub">Isolador de Voz - Separe Voz e Música com IA</p>
  </header>
  
  <div class="container">
    <div class="card">
      <h2>Separação Neural de Áudio</h2>
      
      <div class="info-box">
        <p>Separe voz e música de qualquer áudio usando IA. Ideal para remover ruídos, extrair vocais ou criar versões instrumentais.</p>
      </div>
      
      <div class="file-input-wrapper">
        <input type="file" id="audio-file" accept="audio/*,video/*" />
      </div>
      
      <div class="stem-selector">
        <div class="stem-btn active" data-stem="vocals" onclick="selectStem('vocals')">
          Apenas Voz
        </div>
        <div class="stem-btn" data-stem="accompaniment" onclick="selectStem('accompaniment')">
          Apenas Música
        </div>
      </div>
      
      <button id="process-btn" onclick="processAudio()">Processar Áudio</button>
      
      <div class="loading" id="loading">
        <div class="spinner"></div>
        <p id="progress-text">Processando com IA...</p>
        <p id="progress-percent" style="font-size: 24px; font-weight: 700; color: #b45309; margin-top: 12px;">0%</p>
        <p id="progress-eta" style="font-size: 13px; color: #94a3b8; margin-top: 8px;">Calculando tempo...</p>
      </div>
      
      <div class="status" id="status"></div>
    </div>
  </div>
  
  <script>
    let selectedStem = 'vocals';
    let progressInterval = null;
    
    function selectStem(stem) {
      selectedStem = stem;
      document.querySelectorAll('.stem-btn').forEach(btn => {
        btn.classList.remove('active');
      });
      document.querySelector(`[data-stem="${stem}"]`).classList.add('active');
    }
    
    async function processAudio() {
      const fileInput = document.getElementById('audio-file');
      const status = document.getElementById('status');
      const loading = document.getElementById('loading');
      const processBtn = document.getElementById('process-btn');
      
      if (!fileInput.files.length) {
        status.textContent = 'Por favor, selecione um arquivo de áudio';
        status.className = 'status error';
        return;
      }
      
      const formData = new FormData();
      formData.append('file', fileInput.files[0]);
      formData.append('stem', selectedStem);
      
      processBtn.disabled = true;
      loading.classList.add('show');
      status.textContent = '';
      
      // Iniciar monitoramento de progresso
      let startTime = Date.now();
      progressInterval = setInterval(() => {
        const elapsed = Math.floor((Date.now() - startTime) / 1000);
        const minutes = Math.floor(elapsed / 60);
        const seconds = elapsed % 60;
        document.getElementById('progress-eta').textContent = `Tempo decorrido: ${minutes}m ${seconds}s`;
      }, 1000);
      
      try {
        const response = await fetch('/isolate/process', {
          method: 'POST',
          body: formData
        });
        
        const result = await response.json();
        
        if (progressInterval) {
          clearInterval(progressInterval);
          progressInterval = null;
        }
        
        if (result.success) {
          status.textContent = `${result.filename} salvo em Downloads!`;
          status.className = 'status success';
        } else {
          status.textContent = 'Erro: ' + result.error;
          status.className = 'status error';
        }
      } catch (error) {
        status.textContent = 'Erro ao processar: ' + error.message;
        status.className = 'status error';
      } finally {
        if (progressInterval) {
          clearInterval(progressInterval);
          progressInterval = null;
        }
        processBtn.disabled = false;
        loading.classList.remove('show');
      }
    }
  </script>
</body>
</html>
