<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instruções - LocalTools</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0a0f1e;
      background-image: radial-gradient(at 0% 0%, rgba(34, 197, 94, 0.08) 0px, transparent 50%), radial-gradient(at 100% 0%, rgba(59, 130, 246, 0.06) 0px, transparent 50%);
      color: #e2e8f0;
      min-height: 100vh;
      padding: 40px 15px;
      padding-top: 100px;
    }
    .back-button {
      position: fixed;
      top: 24px;
      left: 24px;
      width: 56px;
      height: 56px;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(40px);
      border-radius: 16px;
      border: 1.5px solid rgba(148, 163, 184, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s;
      z-index: 1000;
      color: #cbd5e1;
      box-shadow: 0 0 0 1px rgba(148, 163, 184, 0.1), 0 8px 24px rgba(0, 0, 0, 0.5);
    }
    .back-button:hover {
      background: rgba(15, 23, 42, 0.95);
      border-color: rgba(34, 197, 94, 0.4);
      color: #22c55e;
      transform: translateX(-6px);
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    .logo {
      font-size: 48px;
      font-weight: 900;
      background: linear-gradient(135deg, #3b82f6 0%, #16a34a 25%, #22c55e 50%, #16a34a 75%, #3b82f6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
      margin-bottom: 10px;
      letter-spacing: 8px;
    }
    .tagline {
      text-align: center;
      color: #64748b;
      font-size: 15px;
      margin-bottom: 32px;
      font-weight: 500;
    }

    /* ---------- Busca e filtros (fixos no topo ao rolar) ---------- */
    .search-wrap {
      position: sticky;
      top: 0;
      z-index: 50;
      margin: 0 -15px 32px;
      padding: 16px 15px 14px;
      background: rgba(10, 15, 30, 0.9);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-bottom: 1px solid rgba(148, 163, 184, 0.08);
    }
    .search-box {
      display: flex;
      align-items: center;
      gap: 12px;
      height: 56px;
      padding: 0 12px 0 18px;
      background: rgba(15, 23, 42, 0.85);
      border: 1.5px solid rgba(148, 163, 184, 0.15);
      border-radius: 16px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-box:focus-within {
      border-color: rgba(34, 197, 94, 0.5);
      box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.1);
    }
    .search-box svg { flex-shrink: 0; color: #64748b; }
    .search-box input {
      flex: 1;
      min-width: 0;
      background: none;
      border: 0;
      outline: 0;
      color: #f8fafc;
      font: 500 16px 'Inter', sans-serif;
    }
    .search-box input::placeholder { color: #64748b; }
    .search-box input::-webkit-search-cancel-button { display: none; }
    .kbd {
      flex-shrink: 0;
      font: 600 12px 'Inter', sans-serif;
      color: #64748b;
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 6px;
      padding: 3px 8px;
    }
    .clear-btn {
      flex-shrink: 0;
      display: none;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: 8px;
      background: rgba(148, 163, 184, 0.1);
      color: #cbd5e1;
      cursor: pointer;
      font-size: 14px;
    }
    .clear-btn:hover { background: rgba(239, 68, 68, 0.15); color: #f87171; }
    .search-box.has-value .clear-btn { display: flex; }
    .search-box.has-value .kbd { display: none; }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.15);
      background: rgba(15, 23, 42, 0.6);
      color: #94a3b8;
      font: 600 13px 'Inter', sans-serif;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .chip:hover { border-color: rgba(34, 197, 94, 0.35); color: #e2e8f0; }
    .chip.active {
      background: rgba(34, 197, 94, 0.14);
      border-color: rgba(34, 197, 94, 0.5);
      color: #4ade80;
    }
    .chip.no-results { opacity: 0.4; }
    .chip-count {
      font-size: 11px;
      padding: 1px 7px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.12);
    }
    .chip.active .chip-count { background: rgba(34, 197, 94, 0.2); }
    .search-info {
      margin-top: 10px;
      font-size: 13px;
      color: #64748b;
    }
    .search-info strong { color: #cbd5e1; font-weight: 600; }
    .example {
      background: none;
      border: 0;
      padding: 0;
      color: #94a3b8;
      font: inherit;
      text-decoration: underline dotted rgba(148, 163, 184, 0.5);
      text-underline-offset: 3px;
      cursor: pointer;
    }
    .example:hover { color: #4ade80; }

    /* ---------- Categorias ---------- */
    .category {
      margin-bottom: 48px;
      scroll-margin-top: 190px;
    }
    .category-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 0 4px 18px;
    }
    .category-icon {
      flex-shrink: 0;
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      background: rgba(34, 197, 94, 0.08);
      border: 1px solid rgba(34, 197, 94, 0.2);
      border-radius: 14px;
    }
    .category-title {
      font-size: 22px;
      font-weight: 800;
      color: #f8fafc;
    }
    .category-desc {
      font-size: 14px;
      color: #64748b;
      margin-top: 2px;
    }
    .category-count {
      margin-left: auto;
      flex-shrink: 0;
      font-size: 12px;
      font-weight: 600;
      color: #94a3b8;
      background: rgba(148, 163, 184, 0.08);
      padding: 6px 12px;
      border-radius: 999px;
    }

    /* ---------- Cartão de app ---------- */
    .app-section {
      background: rgba(15, 23, 42, 0.4);
      border-radius: 20px;
      padding: 32px;
      margin-bottom: 20px;
      border: 1px solid rgba(148, 163, 184, 0.08);
      backdrop-filter: blur(40px);
      scroll-margin-top: 190px;
    }
    .app-section:target { border-color: rgba(34, 197, 94, 0.4); }
    .app-header {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 16px;
    }
    .app-icon {
      font-size: 44px;
      line-height: 1;
    }
    .app-heading {
      flex: 1;
      min-width: 0;
    }
    .app-title {
      font-size: 26px;
      font-weight: 700;
      color: #f8fafc;
    }
    .app-subtitle {
      font-size: 14px;
      color: #94a3b8;
      margin-top: 2px;
    }
    .open-app {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 12px;
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #4ade80;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .open-app:hover { background: rgba(34, 197, 94, 0.2); border-color: rgba(34, 197, 94, 0.6); }
    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }
    .badge {
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid;
    }
    .badge-navegador { color: #4ade80; border-color: rgba(34, 197, 94, 0.3); background: rgba(34, 197, 94, 0.08); }
    .badge-downloads { color: #60a5fa; border-color: rgba(59, 130, 246, 0.3); background: rgba(59, 130, 246, 0.08); }
    .badge-internet { color: #fbbf24; border-color: rgba(245, 158, 11, 0.3); background: rgba(245, 158, 11, 0.08); }
    .badge-ia { color: #f0abfc; border-color: rgba(217, 70, 239, 0.3); background: rgba(217, 70, 239, 0.08); }
    .badge-instalacao { color: #fb923c; border-color: rgba(249, 115, 22, 0.3); background: rgba(249, 115, 22, 0.08); }
    .badge-login { color: #f472b6; border-color: rgba(236, 72, 153, 0.3); background: rgba(236, 72, 153, 0.08); }
    .app-description {
      font-size: 15px;
      color: #94a3b8;
      line-height: 1.8;
      margin-bottom: 20px;
    }
    .features {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr));
      gap: 12px;
    }
    .feature {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px;
      background: rgba(15, 23, 42, 0.6);
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.1);
      color: inherit;
      text-decoration: none;
      transition: border-color 0.2s, background 0.2s;
    }
    a.feature:hover {
      border-color: rgba(34, 197, 94, 0.35);
      background: rgba(15, 23, 42, 0.85);
    }
    .feature-icon {
      font-size: 20px;
      flex-shrink: 0;
    }
    .feature-text {
      flex: 1;
      min-width: 0;
    }
    .feature-title {
      font-size: 14px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 4px;
    }
    .feature-desc {
      font-size: 13px;
      color: #64748b;
      line-height: 1.6;
    }
    .feature-go {
      flex-shrink: 0;
      font-size: 14px;
      color: #475569;
      transition: color 0.2s;
    }
    a.feature:hover .feature-go { color: #4ade80; }
    .sub-section {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid rgba(148, 163, 184, 0.1);
    }
    .sub-title {
      font-size: 16px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 12px;
    }
    .note {
      margin-top: 16px;
      padding: 14px 16px;
      border-radius: 12px;
      background: rgba(59, 130, 246, 0.06);
      border: 1px solid rgba(59, 130, 246, 0.18);
      color: #94a3b8;
      font-size: 13px;
      line-height: 1.7;
    }
    .note strong { color: #cbd5e1; }
    .show-all {
      margin-top: 14px;
      width: 100%;
      padding: 10px 14px;
      background: none;
      border: 1px dashed rgba(148, 163, 184, 0.25);
      border-radius: 10px;
      color: #94a3b8;
      font: 600 13px 'Inter', sans-serif;
      cursor: pointer;
      transition: all 0.2s;
    }
    .show-all:hover { border-color: rgba(34, 197, 94, 0.5); color: #4ade80; }
    mark {
      background: rgba(34, 197, 94, 0.28);
      color: #f8fafc;
      border-radius: 3px;
      padding: 0 1px;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #64748b;
    }
    .empty-state-icon { font-size: 48px; margin-bottom: 12px; }
    .empty-state-title { font-size: 18px; font-weight: 600; color: #cbd5e1; margin-bottom: 8px; }
    .empty-state p { font-size: 14px; line-height: 1.7; }
    .empty-state button {
      margin-top: 16px;
      padding: 10px 18px;
      border-radius: 12px;
      border: 1px solid rgba(34, 197, 94, 0.3);
      background: rgba(34, 197, 94, 0.1);
      color: #4ade80;
      font: 600 14px 'Inter', sans-serif;
      cursor: pointer;
    }

    /* Em telas menores o botão de voltar sairia por cima da busca fixa */
    @media (max-width: 1360px) {
      .back-button { position: absolute; }
    }
    @media (max-width: 640px) {
      body { padding-top: 96px; }
      .logo { font-size: 36px; letter-spacing: 6px; }
      .kbd { display: none; }
      .chips { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
      .chips::-webkit-scrollbar { display: none; }
      .category-header { align-items: flex-start; }
      .category-icon { width: 44px; height: 44px; font-size: 22px; }
      .category-title { font-size: 19px; }
      .category-count { display: none; }
      .app-section { padding: 20px; border-radius: 16px; }
      .app-icon { font-size: 36px; }
      .app-title { font-size: 21px; }
      .open-app { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>
  <div class="back-button" onclick="location.href='/'">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M19 12H5M5 12L12 19M5 12L12 5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <div class="container">
    <div class="logo">LOCALTOOLS</div>
    <div class="tagline" id="tagline">Guia Completo de Funcionalidades</div>

    <div class="search-wrap">
      <label class="search-box" id="search-box">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
          <path d="M20 20L16.5 16.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input type="search" id="search" autocomplete="off" spellcheck="false"
               placeholder="Buscar app, função ou formato…"
               aria-label="Buscar nas instruções">
        <span class="kbd">/</span>
        <button type="button" class="clear-btn" id="clear" aria-label="Limpar busca">✕</button>
      </label>
      <div class="chips" id="chips"></div>
      <div class="search-info" id="info"></div>
    </div>

    <div id="content"></div>
    <div style="height: 60px;"></div>
  </div>

  <script>
    // Conteúdo do guia. Para documentar um app novo, adicione um objeto em
    // "apps" da categoria certa: id, icon, name, subtitle, url, desc e features
    // ({icon, title, desc, url?}). "keywords" não aparece na tela, só entra na
    // busca (sinônimos, termos em inglês etc.); "badges" usa as chaves de BADGES.
    const BADGES = {
      navegador: '🌐 Roda no navegador',
      downloads: '💾 Salva em Downloads',
      internet: '📶 Requer internet',
      ia: '🤖 Usa IA',
      instalacao: '📦 IA opcional: instalação extra',
      login: '🔑 Requer login no Instagram',
      whatsapp: '📱 Conecta ao seu WhatsApp',
    };

    const CATEGORIAS = [
      {
        id: 'downloads', icon: '📥', name: 'Downloads & Streaming', short: 'Downloads',
        desc: 'Baixe vídeos, áudios e mídias da internet e assista conteúdo',
        apps: [
          {
            id: 'verto', icon: '🎬', name: 'Verto', subtitle: 'Downloader de vídeos do YouTube', url: '/verto',
            badges: ['internet', 'downloads'],
            keywords: 'youtube yt baixar download yt-dlp',
            desc: 'Cole o link de um vídeo do YouTube, veja a prévia e baixe em vídeo, áudio ou só a thumbnail, escolhendo a qualidade antes.',
            features: [
              { icon: '📺', title: 'Download de Vídeos MP4', desc: 'Melhor qualidade disponível, 8K, 4K, 2K, 1080p, 720p, 480p, 360p ou o menor arquivo possível. Tamanho estimado em tempo real.' },
              { icon: '🎵', title: 'Download de Áudio MP3', desc: 'Bitrates: 320 kbps (alta), 256 kbps, 192 kbps (média) e 128 kbps (baixa).' },
              { icon: '🖼️', title: 'Download de Thumbnails', kw: 'capa miniatura', desc: 'Formatos PNG e JPG. Resoluções: Máxima, Alta, Média e Padrão.' },
              { icon: '⚡', title: 'Preview em Tempo Real', desc: 'Veja thumbnail, título e duração do vídeo antes de baixar.' },
              { icon: '💬', title: 'Erros Explicados', desc: 'Vídeo privado, com restrição de idade, exclusivo para membros, removido por direitos autorais ou live que ainda não começou aparecem com mensagem clara.' },
            ],
            note: 'Os arquivos vão para a pasta <strong>Downloads</strong>, com nome único se já existir um igual. O YouTube passou a exigir um runtime JavaScript para liberar os formatos: o <strong>INSTALAR.py</strong> baixa o Deno automaticamente (Node, Bun ou QuickJS também servem). Se vídeos públicos aparecerem como “não disponíveis”, rode o instalador de novo ou o ATUALIZAR.py.',
          },
          {
            id: 'instasaver', icon: '📸', name: 'InstaSaver', subtitle: 'Stories, destaques e posts do Instagram', url: '/instasaver',
            badges: ['internet', 'login'],
            keywords: 'instagram insta ig stories highlights reel baixar download salvar perfil saveclip',
            desc: 'Cole o link de um story, destaque, post, reel ou perfil (ou só o @usuário) e o app mostra tudo do perfil dono do link: stories, destaques e posts, com download individual ou em ZIP.',
            features: [
              { icon: '🔗', title: 'Link Automático', desc: 'Reconhece links de story, destaque (inclusive o link curto /s/ compartilhado pelo app), post, reel ou perfil, e também um @usuário digitado. Tem botão “Colar” para usar a área de transferência.' },
              { icon: '⏱️', title: 'Stories', desc: 'Stories das últimas 24h do perfil, com botão para baixar todos em .zip.' },
              { icon: '⭐', title: 'Destaques', desc: 'Abra qualquer destaque do perfil e baixe-o inteiro em .zip.' },
              { icon: '🖼️', title: 'Posts e Reels', desc: 'Grade de posts e reels com “Carregar mais” e download de todos os carregados em .zip.' },
              { icon: '👤', title: 'Foto de Perfil', desc: 'Baixe a foto de perfil ou abra o perfil direto no Instagram.' },
              { icon: '🔍', title: 'Visualizador', desc: 'Abra fotos e vídeos em tela cheia e navegue entre eles pelas setas ‹ ›, baixando um a um.' },
            ],
            note: 'É preciso estar <strong>logado no Instagram em um navegador desta máquina</strong> (Chrome, Firefox, Chromium, Brave, Edge, Opera ou Vivaldi): o app reaproveita essa sessão e só mostra o que a sua conta já pode ver. Para escolher o navegador, defina a variável <strong>INSTASAVER_BROWSER</strong>; para usar um cookies.txt exportado, defina <strong>INSTASAVER_COOKIES</strong>. No Linux, ler a sessão do Chrome exige o pacote secretstorage (já está no requirements.txt).',
          },
          {
            id: 'vscosaver', icon: '🎞️', name: 'VscoSaver', subtitle: 'Galeria, coleção e spaces do VSCO', url: '/vscosaver',
            badges: ['internet'],
            keywords: 'vsco vsco.co galeria gallery colecao collection repost spaces foto video baixar download salvar perfil preset filtro',
            desc: 'Cole o link de um perfil, foto, vídeo, coleção ou space do VSCO (ou só o nome do usuário) e o app mostra tudo do perfil dono do link: galeria, coleção e spaces, com download individual ou em ZIP.',
            features: [
              { icon: '🔗', title: 'Link Automático', desc: 'Reconhece links de perfil (vsco.co/usuario/gallery), foto (/media/), vídeo (/video/), coleção (/collection/), spaces e o endereço antigo usuario.vsco.co, e também um nome de usuário digitado. Tem botão “Colar” para usar a área de transferência.' },
              { icon: '🖼️', title: 'Galeria', desc: 'Fotos e vídeos do perfil em tamanho original, com “Carregar mais” automático e download de todos os carregados em .zip.' },
              { icon: '🔁', title: 'Coleção', desc: 'Os reposts do perfil (a aba Collection do VSCO), mostrando o autor original de cada foto.' },
              { icon: '🪐', title: 'Spaces', desc: 'Abra qualquer space do perfil e baixe-o inteiro em .zip.' },
              { icon: '🎞️', title: 'Preset e Câmera', kw: 'filtro exif iso', desc: 'O visualizador mostra o preset usado (A5, HB1...), a câmera e os dados de exposição de cada foto.' },
              { icon: '🎬', title: 'Vídeos', desc: 'Vídeos novos do VSCO vêm em pedaços (HLS): o app junta tudo num .mp4 sem perder qualidade antes de tocar ou baixar.' },
              { icon: '👤', title: 'Foto de Perfil', desc: 'Baixe a foto de perfil em tamanho original ou abra o perfil direto no VSCO.' },
            ],
            note: 'Não precisa de login: o VSCO é público. O app usa o pacote <strong>curl_cffi</strong> (já está no requirements.txt) porque o VSCO bloqueia requisições que não parecem vir de um navegador, e o <strong>FFmpeg</strong> para montar os vídeos. Se aparecer “O VSCO limitou as requisições”, espere um ou dois minutos antes de buscar de novo.',
          },
          {
            id: 'whatssaver', icon: '💬', name: 'WhatsSaver', subtitle: 'Fotos e vídeos das conversas do WhatsApp', url: '/whatssaver',
            badges: ['internet', 'whatsapp'],
            keywords: 'whatsapp zap wpp conversa chat contato grupo foto video midia arquivo documento baixar download salvar backup exportar galeria heic',
            desc: 'Conecte o seu WhatsApp (como no WhatsApp Web), escolha uma conversa e veja todas as fotos e vídeos dela — inclusive os enviados como arquivo/documento — com download direto dos servidores do WhatsApp, mesmo do que o celular nunca baixou.',

    // ---------- Busca ----------
    // A comparação ignora acentos e maiúsculas: "audio" encontra "Áudio".
    const STOPWORDS = new Set(['de', 'da', 'do', 'das', 'dos', 'a', 'o', 'as', 'os', 'e', 'em', 'no', 'na', 'nos', 'nas',
      'um', 'uma', 'para', 'pra', 'com', 'por', 'que', 'como', 'meu', 'minha']);

    function fold(text) {
      return String(text).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
    }

    function stripTags(html) {
      return String(html).replace(/<[^>]+>/g, '');
    }

    // Plural simples do português: "imagem" e "imagens" se acham, "funções"
    // acha "função", "legendas" acha "legenda".
    function variants(term) {
      const list = [term];
      if (term.length > 3) {
        if (term.endsWith('ns')) list.push(term.slice(0, -2) + 'm');
        if (term.endsWith('m')) list.push(term.slice(0, -1) + 'ns');
        if (term.endsWith('oes') || term.endsWith('aes')) list.push(term.slice(0, -3) + 'ao');
        if (term.endsWith('s')) list.push(term.slice(0, -1));
      }
      return list;
    }

    // Cada termo vira uma regex sobre o texto sem acento. Termos de até 2 letras
    // ("ia", "js", "3d") só casam com a palavra inteira, senão "ia" acharia
    // "mídia", "via", "cópia"...
    function termsOf(query) {
      const all = fold(query).split(/\s+/).filter(Boolean);
      const useful = all.filter(t => !STOPWORDS.has(t));
      return (useful.length ? useful : all).map(term => {
        const alternatives = variants(term).map(v => v.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|');
        const source = term.length <= 2 ? `\\b(?:${alternatives})\\b` : `(?:${alternatives})`;
        return { test: new RegExp(source), scan: new RegExp(source, 'g') };
      });
    }

    function has(text, term) {
      return term.test.test(text);
    }

    function escapeHtml(text) {
      return String(text).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    }

    // Destaca os termos no texto original. Cada caractere é "dobrado" isoladamente,
    // mantendo um mapa de posição para realçar a palavra com acento correta.
    function highlight(text, terms) {
      if (!terms.length) return escapeHtml(text);
      let folded = '';
      const map = [];
      for (let i = 0; i < text.length; i++) {
        const f = fold(text[i]);
        for (let k = 0; k < f.length; k++) { folded += f[k]; map.push(i); }
      }
      const marked = new Array(text.length).fill(false);
      for (const term of terms) {
        term.scan.lastIndex = 0;
        let m;
        while ((m = term.scan.exec(folded)) !== null) {
          if (!m[0].length) { term.scan.lastIndex++; continue; }
          for (let j = m.index; j < m.index + m[0].length; j++) marked[map[j]] = true;
        }
      }
      let out = '';
      let open = false;
      for (let i = 0; i < text.length; i++) {
        if (marked[i] && !open) { out += '<mark>'; open = true; }
        if (!marked[i] && open) { out += '</mark>'; open = false; }
        out += escapeHtml(text[i]);
      }
      return open ? out + '</mark>' : out;
    }

    // Igual ao highlight, mas preserva as tags <strong> que existem nas notas.
    function highlightHtml(html, terms) {
      return html.split(/(<[^>]+>)/).map(part => part.startsWith('<') ? part : highlight(part, terms)).join('');
    }

    // Pré-calcula o texto pesquisável de cada app e função ("kw" são sinônimos
    // de uma função específica, que não aparecem na tela).
    let TOTAL_APPS = 0;
    for (const cat of CATEGORIAS) {
      for (const app of cat.apps) {
        TOTAL_APPS++;
        app.nameText = fold([app.name, app.subtitle, app.keywords || ''].join(' '));
        app.ctxText = fold([app.desc, stripTags(app.note || ''), (app.badges || []).map(b => BADGES[b]).join(' ')].join(' '));
        for (const f of app.features) f.text = fold([f.title || '', f.desc, f.kw || ''].join(' '));
        for (const u of app.usos || []) u.text = fold(u.desc);
      }
    }

    // Decide o que mostrar de um app para a busca atual:
    //  - todos os termos batem com nome/subtítulo/palavras-chave: app inteiro;
    //  - senão, os termos que sobram precisam estar na função (ou na descrição

    function matchApp(app, terms) {
      const total = app.features.length + (app.usos || []).length;
      const specific = terms.filter(t => !has(app.nameText, t));
      if (!specific.length) {
        return { features: app.features, usos: app.usos || [], hidden: 0 };
      }
      const hit = item => specific.some(t => has(item.text, t)) &&
        specific.every(t => has(item.text, t) || has(app.ctxText, t));
      const features = app.features.filter(hit);
      const usos = (app.usos || []).filter(hit);
      if (features.length || usos.length) {
        return { features, usos, hidden: total - features.length - usos.length };

      if (specific.every(t => has(app.ctxText, t))) {

      const expanded = state.expanded.has(app.id);
      const features = expanded ? app.features : match.features;
      const usos = expanded ? (app.usos || []) : match.usos;
      const total = app.features.length + (app.usos || []).length;
      const badges = (app.badges || []).map(b => `<span class="badge badge-${b}">${BADGES[b]}</span>`).join('');
      return `
        <article class="app-section" id="app-${app.id}">
          <div class="app-header">
            <div class="app-icon">${app.icon}</div>
            <div class="app-heading">
              <h3 class="app-title">${highlight(app.name, terms)}</h3>
              <div class="app-subtitle">${highlight(app.subtitle, terms)}</div>
            </div>
            <a class="open-app" href="${app.url}">Abrir app
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </a>
          </div>
          ${badges ? `<div class="badges">${badges}</div>` : ''}
          <p class="app-description">${highlight(app.desc, terms)}</p>
          ${features.length ? `<div class="features">${features.map(f => renderFeature(f, terms)).join('')}</div>` : ''}
          ${usos.length ? `
            <div class="sub-section">
              <div class="sub-title">📋 Casos de Uso</div>
              <div class="features">${usos.map(u => renderFeature(u, terms)).join('')}</div>
            </div>` : ''}
          ${app.note ? `<div class="note">ℹ️ ${highlightHtml(app.note, terms)}</div>` : ''}
          ${match.hidden && !expanded ? `<button type="button" class="show-all" data-app="${app.id}">${match.hidden === total
            ? `Mostrar as ${total} funções`
            : `Mostrar todas as ${total} funções (${total - match.hidden} ${total - match.hidden === 1 ? 'encontrada' : 'encontradas'})`}</button>` : ''}
        </article>`;
    }

    function render() {
      const terms = termsOf(state.query);
      const perCat = {};
      let found = 0;
      let html = '';

      for (const cat of CATEGORIAS) {
        const shown = [];
        for (const app of cat.apps) {
          const match = matchApp(app, terms);
          if (!match) continue;
          perCat[cat.id] = (perCat[cat.id] || 0) + 1;
          if (state.cat === 'todas' || state.cat === cat.id) shown.push(renderApp(app, match, terms));
        }
        if (!shown.length) continue;
        found += shown.length;
        html += `
          <section class="category" id="cat-${cat.id}">
            <div class="category-header">
              <div class="category-icon">${cat.icon}</div>
              <div>
                <h2 class="category-title">${escapeHtml(cat.name)}</h2>
                <p class="category-desc">${escapeHtml(cat.desc)}</p>
              </div>
              <span class="category-count">${shown.length} ${shown.length === 1 ? 'app' : 'apps'}</span>
            </div>
            ${shown.join('')}
          </section>`;
      }

      const allMatches = Object.values(perCat).reduce((a, b) => a + b, 0);
      renderChips(perCat, allMatches);

      const catName = state.cat === 'todas' ? '' : CATEGORIAS.find(c => c.id === state.cat).name;
      if (!terms.length) {
        $info.innerHTML = catName
          ? `Mostrando <strong>${found}</strong> ${found === 1 ? 'app' : 'apps'} de <strong>${escapeHtml(catName)}</strong>`
          : `<strong>${TOTAL_APPS}</strong> apps em <strong>${CATEGORIAS.length}</strong> categorias · experimente: ` +
            EXEMPLOS.map(q => `<button type="button" class="example" data-q="${q}">${q}</button>`).join(', ');
      } else if (found) {
        $info.innerHTML = `<strong>${found}</strong> ${found === 1 ? 'app encontrado' : 'apps encontrados'} para “${escapeHtml(state.query.trim())}”` +
          (catName ? ` em <strong>${escapeHtml(catName)}</strong>` : '');
      } else {
        $info.innerHTML = '';
      }

      if (!found) {
        const elsewhere = catName && allMatches
          ? `<p>Mas há <strong>${allMatches}</strong> ${allMatches === 1 ? 'resultado' : 'resultados'} em outras categorias.</p><button type="button" data-action="all-cats">Ver todas as categorias</button>`
          : `<p>Tente outra palavra, um sinônimo ou o nome do formato (ex.: “mp3”, “docx”, “srt”).</p><button type="button" data-action="clear">Limpar busca</button>`;
        html = `
          <div class="empty-state">
            <div class="empty-state-icon">🔎</div>
            <div class="empty-state-title">Nada encontrado para “${escapeHtml(state.query.trim())}”${catName ? ` em ${escapeHtml(catName)}` : ''}</div>
            ${elsewhere}
          </div>`;
      }
      $content.innerHTML = html;
      $box.classList.toggle('has-value', state.query.length > 0);
    }

    function renderChips(perCat, allMatches) {
      const searching = termsOf(state.query).length > 0;
      const chip = (id, icon, label, count) => `
        <button type="button" class="chip${state.cat === id ? ' active' : ''}${searching && !count ? ' no-results' : ''}" data-cat="${id}">
          ${icon} ${escapeHtml(label)} <span class="chip-count">${count}</span>
        </button>`;
      $chips.innerHTML = chip('todas', '✨', 'Todas', searching ? allMatches : TOTAL_APPS) +
        CATEGORIAS.map(c => chip(c.id, c.icon, c.short, searching ? (perCat[c.id] || 0) : c.apps.length)).join('');
    }

    // Mantém busca e categoria na URL (ex.: /instructions?q=legenda) para dar
    // para compartilhar ou abrir um resultado direto.
    function syncUrl() {
      const params = new URLSearchParams();
      if (state.query.trim()) params.set('q', state.query.trim());
      if (state.cat !== 'todas') params.set('cat', state.cat);
      const qs = params.toString();
      history.replaceState(null, '', location.pathname + (qs ? '?' + qs : '') + location.hash);
    }

    function update() {
      state.expanded.clear();
      render();
      syncUrl();
    }

    $search.addEventListener('input', () => {
      state.query = $search.value;
      update();
    });

    document.getElementById('clear').addEventListener('click', e => {
      e.preventDefault();
      $search.value = '';
      state.query = '';
      update();
      $search.focus();
    });

    $info.addEventListener('click', e => {
      const example = e.target.closest('.example');
      if (!example) return;
      $search.value = state.query = example.dataset.q;
      update();
      $search.focus();
    });

    $chips.addEventListener('click', e => {
      const btn = e.target.closest('.chip');
      if (!btn) return;
      state.cat = btn.dataset.cat;
      update();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    $content.addEventListener('click', e => {
      const showAll = e.target.closest('.show-all');
      if (showAll) {
        state.expanded.add(showAll.dataset.app);
        render();
        return;
      }
      const action = e.target.closest('[data-action]');
      if (!action) return;
      if (action.dataset.action === 'all-cats') state.cat = 'todas';
      if (action.dataset.action === 'clear') { $search.value = ''; state.query = ''; }
      update();
    });

    document.addEventListener('keydown', e => {
      const typing = ['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName);
      if ((e.key === '/' && !typing) || (e.key.toLowerCase() === 'k' && (e.ctrlKey || e.metaKey))) {
        e.preventDefault();
        $search.focus();
        $search.select();
      } else if (e.key === 'Escape' && document.activeElement === $search) {
        $search.value = '';
        state.query = '';
        update();
        $search.blur();
      }
    });

    const params = new URLSearchParams(location.search);
    state.query = params.get('q') || '';
    state.cat = CATEGORIAS.some(c => c.id === params.get('cat')) ? params.get('cat') : 'todas';
    $search.value = state.query;
    render();
    if (location.hash) {
      const target = document.getElementById(decodeURIComponent(location.hash.slice(1)));
      if (target) target.scrollIntoView();
    }
  </script>
</body>
</html>
