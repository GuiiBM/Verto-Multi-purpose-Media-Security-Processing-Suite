<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instruções - LocalTools</title>
  <meta name="theme-color" content="#0b0c0f">
  <link rel="icon" type="image/svg+xml" href="/static/localtools/verto.svg">
  <link rel="stylesheet" href="/static/localtools/base.css">
  <link rel="stylesheet" href="/static/localtools/app.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { overflow-x: clip; }
    body { min-height: 100vh; padding: 28px 16px 40px; }
    body > * { position: relative; z-index: 1; }
    .container { max-width: 1120px; margin: 0 auto; }

    .topo { display: flex; justify-content: center; margin-bottom: 26px; }
    .lt-head { margin-bottom: 30px; }

    /* ---------- Busca e filtros (fixos no topo ao rolar) ---------- */
    .search-wrap {
      position: sticky;
      top: 0;
      z-index: 50;
      margin: 0 -16px 34px;
      padding: 14px 16px 12px;
      background: rgba(11, 12, 15, 0.82);
      backdrop-filter: blur(22px) saturate(140%);
      -webkit-backdrop-filter: blur(22px) saturate(140%);
      border-bottom: 1px solid var(--lt-line);
    }
    .search-box {
      display: flex;
      align-items: center;
      gap: 12px;
      height: 54px;
      padding: 0 12px 0 18px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--lt-line);
      border-radius: 16px;
      box-shadow: var(--lt-shadow);
      transition: border-color var(--lt-dur) var(--lt-ease-out), box-shadow var(--lt-dur) var(--lt-ease-out);
    }
    .search-box:hover { border-color: var(--lt-line-2); }
    .search-box:focus-within { border-color: rgba(74, 222, 128, 0.5); box-shadow: 0 0 0 4px var(--lt-ring), var(--lt-shadow); }
    .search-box svg { flex-shrink: 0; color: var(--lt-faint); }
    .search-box:focus-within svg { color: var(--lt-green); }
    .search-box input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--lt-ink); font: 450 16px var(--lt-sans); }
    .search-box input::placeholder { color: var(--lt-faint); }
    .search-box input::-webkit-search-cancel-button { display: none; }
    .kbd { flex-shrink: 0; font: 500 12px var(--lt-mono); color: var(--lt-faint); border: 1px solid var(--lt-line-2); border-bottom-width: 2px; border-radius: 7px; padding: 2px 8px; }
    .clear-btn {
      flex-shrink: 0; display: none; align-items: center; justify-content: center; width: 32px; height: 32px; border: 0;
      border-radius: 9px; background: rgba(255, 255, 255, 0.06); color: var(--lt-muted); cursor: pointer; font-size: 14px;
    }
    .clear-btn:hover { background: rgba(248, 113, 113, 0.15); color: var(--lt-danger); }
    .search-box.has-value .clear-btn { display: flex; }
    .search-box.has-value .kbd { display: none; }

    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .chip {
      --hue: var(--lt-green);
      display: inline-flex; align-items: center; gap: 7px; min-height: 32px; padding: 5px 11px 5px 9px; border-radius: 999px;
      border: 1px solid var(--lt-line); background: rgba(255, 255, 255, 0.025); color: var(--lt-muted);
      font: 500 13px var(--lt-sans); cursor: pointer; white-space: nowrap;
      transition: color var(--lt-dur-fast) var(--lt-ease-out), border-color var(--lt-dur-fast) var(--lt-ease-out), background-color var(--lt-dur-fast) var(--lt-ease-out);
    }
    .chip:hover { color: var(--lt-ink); border-color: color-mix(in srgb, var(--hue) 45%, transparent); }
    .chip.active { color: #fff; border-color: color-mix(in srgb, var(--hue) 70%, transparent); background: color-mix(in srgb, var(--hue) 16%, transparent); }
    .chip:focus-visible { outline: 2px solid var(--hue); outline-offset: 2px; }
    .chip.no-results { opacity: 0.4; }
    .chip-count { font: 500 11px var(--lt-mono); color: var(--lt-faint); }
    .chip.active .chip-count { color: color-mix(in srgb, var(--hue) 70%, #fff); }
    .search-info { margin-top: 10px; font-size: 13px; color: var(--lt-faint); }
    .search-info strong { color: var(--lt-ink); font-weight: 600; }
    .example {
      background: none; border: 0; padding: 0; color: var(--lt-muted); font: inherit; cursor: pointer;
      text-decoration: underline dotted rgba(255, 255, 255, 0.3); text-underline-offset: 3px;
    }
    .example:hover { color: var(--lt-green); }

    /* ---------- Categorias ---------- */
    .category { margin-bottom: 52px; scroll-margin-top: 190px; }
    .category-header { display: flex; align-items: center; gap: 16px; margin: 0 4px 20px; }
    .category-title { font-size: 24px; font-weight: 720; letter-spacing: -0.025em; color: var(--lt-ink); }
    .category-desc { font-size: 14px; color: var(--lt-muted); margin-top: 3px; }
    .category-count {
      margin-left: auto; flex-shrink: 0; font: 500 12px var(--lt-mono); color: color-mix(in srgb, var(--hue) 75%, #fff);
      border: 1px solid color-mix(in srgb, var(--hue) 35%, transparent); background: color-mix(in srgb, var(--hue) 9%, transparent);
      padding: 5px 11px; border-radius: 999px;
    }

    /* ---------- Cartão de app ---------- */
    .app-section {
      position: relative;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.045), rgba(255, 255, 255, 0.018));
      border: 1px solid var(--lt-line);
      border-radius: 22px;
      padding: 28px;
      margin-bottom: 16px;
      box-shadow: var(--lt-shadow);
      scroll-margin-top: 190px;
      overflow: hidden;
    }
    /* filete na cor do grupo, no topo do cartão */
    .app-section::before {
      content: ''; position: absolute; left: 0; right: 0; top: 0; height: 2px;
      background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--hue) 80%, transparent), transparent);
      opacity: 0.7;
    }
    .app-section:target { border-color: color-mix(in srgb, var(--hue) 55%, transparent); }
    .app-header { display: flex; align-items: center; flex-wrap: wrap; gap: 16px; margin-bottom: 16px; }
    .app-heading { flex: 1; min-width: 0; }
    .app-title { font-size: 25px; font-weight: 720; letter-spacing: -0.025em; color: var(--lt-ink); }
    .app-subtitle { font-size: 14px; color: var(--lt-muted); margin-top: 3px; }
    .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .badge { font-size: 12px; font-weight: 550; padding: 4px 10px; border-radius: 999px; border: 1px solid; }
    .badge-navegador { color: #86efac; border-color: rgba(74, 222, 128, 0.3); background: rgba(74, 222, 128, 0.07); }
    .badge-downloads { color: #93c5fd; border-color: rgba(96, 165, 250, 0.3); background: rgba(96, 165, 250, 0.07); }
    .badge-documentos { color: #6ee7b7; border-color: rgba(16, 185, 129, 0.3); background: rgba(16, 185, 129, 0.07); }
    .badge-internet { color: #fcd34d; border-color: rgba(251, 191, 36, 0.3); background: rgba(251, 191, 36, 0.07); }
    .badge-ia { color: #f0abfc; border-color: rgba(217, 70, 239, 0.3); background: rgba(217, 70, 239, 0.07); }
    .badge-instalacao { color: #fdba74; border-color: rgba(251, 146, 60, 0.3); background: rgba(251, 146, 60, 0.07); }
    .badge-login { color: #f9a8d4; border-color: rgba(244, 114, 182, 0.3); background: rgba(244, 114, 182, 0.07); }
    .badge-whatsapp { color: #86efac; border-color: rgba(74, 222, 128, 0.3); background: rgba(74, 222, 128, 0.07); }
    .app-description { font-size: 15px; color: #b3b9c3; line-height: 1.75; margin-bottom: 20px; max-width: 78ch; }
    .features { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 10px; }
    .feature {
      display: flex; align-items: flex-start; gap: 12px; padding: 13px 14px;
      background: rgba(255, 255, 255, 0.025); border: 1px solid var(--lt-line); border-radius: 14px;
      color: inherit; text-decoration: none;
      transition: border-color var(--lt-dur-fast) var(--lt-ease-out), background-color var(--lt-dur-fast) var(--lt-ease-out), transform var(--lt-dur-fast) var(--lt-ease-out);
    }
    a.feature:hover { border-color: color-mix(in srgb, var(--hue) 45%, transparent); background: rgba(255, 255, 255, 0.045); transform: translateY(-1px); }
    a.feature:focus-visible { outline: 2px solid var(--hue); outline-offset: 2px; }
    .feature-icon { font-size: 19px; flex-shrink: 0; line-height: 1.2; }
    .feature-text { flex: 1; min-width: 0; }
    .feature-title { font-size: 14px; font-weight: 620; color: var(--lt-ink); margin-bottom: 4px; }
    .feature-desc { font-size: 13px; color: var(--lt-muted); line-height: 1.6; }
    .feature-go { flex-shrink: 0; font-size: 14px; color: var(--lt-faint); transition: color var(--lt-dur-fast) var(--lt-ease-out); }
    a.feature:hover .feature-go { color: var(--hue); }
    .sub-section { margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--lt-line); }
    .sub-title { font-size: 15px; font-weight: 620; color: var(--lt-ink); margin-bottom: 12px; }
    .note {
      margin-top: 16px; padding: 14px 16px; border-radius: 14px; background: rgba(96, 165, 250, 0.06);
      border: 1px solid rgba(96, 165, 250, 0.18); color: #b3b9c3; font-size: 13px; line-height: 1.7;
    }
    .note strong { color: var(--lt-ink); }
    .show-all {
      margin-top: 14px; width: 100%; min-height: 42px; padding: 10px 14px; background: none;
      border: 1px dashed var(--lt-line-2); border-radius: 12px; color: var(--lt-muted); font: 550 13px var(--lt-sans); cursor: pointer;
      transition: border-color var(--lt-dur-fast) var(--lt-ease-out), color var(--lt-dur-fast) var(--lt-ease-out);
    }
    .show-all:hover { border-color: color-mix(in srgb, var(--hue) 55%, transparent); color: var(--lt-ink); }
    mark { background: rgba(74, 222, 128, 0.25); color: #fff; border-radius: 3px; padding: 0 1px; }

    .empty-state { text-align: center; padding: 60px 20px; color: var(--lt-muted); }
    .empty-state .lt-key { margin: 0 auto 16px; }
    .empty-state-title { font-size: 18px; font-weight: 620; color: var(--lt-ink); margin-bottom: 8px; }
    .empty-state p { font-size: 14px; line-height: 1.7; }
    .empty-state button { margin-top: 16px; }

    @media (max-width: 640px) {
      body { padding-top: 76px; }
      .kbd { display: none; }
      .chips { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
      .chips::-webkit-scrollbar { display: none; }
      .category-header { align-items: flex-start; }
      .category-title { font-size: 20px; }
      .category-count { display: none; }
      .app-section { padding: 20px; border-radius: 18px; }
      .app-title { font-size: 21px; }
      .open-app { width: 100%; }
    }
  </style>
  <link rel="stylesheet" href="/static/localtools/modos/tema-manual.css">
</head>
<body class="lt-body tema-manual">
  <a class="lt-back" href="/" title="Voltar ao menu" aria-label="Voltar ao menu">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M19 12H5M5 12L12 19M5 12L12 5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </a>

  <div class="container">
    <div class="topo"><a class="lt-brand" href="/"><span>LOCALTOOLS</span></a></div>
    <header class="lt-head">
      <span class="lt-key lg" style="--hue: var(--lt-cat-ajuda)"><img src="/static/localtools/apps/instructions.webp" alt="" width="76" height="76"></span>
      <h1>Instruções</h1>
      <p id="tagline">O guia completo de cada app: o que ele faz, como usar e onde os arquivos vão parar.</p>
    </header>

    <div class="search-wrap">
      <label class="search-box" id="search-box">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
          <path d="M20 20L16.5 16.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input type="search" id="search" autocomplete="off" spellcheck="false"
               placeholder="Buscar app, função ou formato…"
               aria-label="Buscar nas instruções">
        <span class="kbd">/</span>
        <button type="button" class="clear-btn" id="clear" aria-label="Limpar busca">✕</button>
      </label>
      <div class="chips" id="chips"></div>
      <div class="search-info" id="info"></div>
    </div>

    <div id="content"></div>
    <div style="height: 60px;"></div>
  </div>

  <script>
    // Conteúdo do guia. Para documentar um app novo, adicione um objeto em
    // "apps" da categoria certa: id, icon, name, subtitle, url, desc e features
    // ({icon, title, desc, url?}). "keywords" não aparece na tela, só entra na
    // busca (sinônimos, termos em inglês etc.); "badges" usa as chaves de BADGES.
    const BADGES = {
      navegador: 'Roda no navegador',
      downloads: 'Salva em Downloads',
      documentos: 'Organiza em Documentos',
      internet: 'Requer internet',
      ia: 'Usa IA',
      instalacao: 'IA opcional: instalação extra',
      login: 'Requer login no Instagram',
      whatsapp: 'Conecta ao seu WhatsApp',
    };

    const CATEGORIAS = [
      {
        id: 'downloads', icon: '📥', name: 'Downloads & Streaming', short: 'Downloads',
        desc: 'Baixe vídeos, áudios e mídias da internet e assista conteúdo',
        apps: [
          {
            id: 'verto', icon: '🎬', name: 'Verto', subtitle: 'Downloader de vídeos do YouTube', url: '/verto',
            badges: ['internet', 'downloads'],
            keywords: 'youtube yt baixar download yt-dlp',
            desc: 'Cole o link de um vídeo do YouTube, veja a prévia e baixe em vídeo, áudio ou só a thumbnail, escolhendo a qualidade antes.',
            features: [
              { icon: '📺', title: 'Download de Vídeos MP4', desc: 'Melhor qualidade disponível, 8K, 4K, 2K, 1080p, 720p, 480p, 360p ou o menor arquivo possível. Tamanho estimado em tempo real.' },
              { icon: '🎵', title: 'Download de Áudio MP3', desc: 'Bitrates: 320 kbps (alta), 256 kbps, 192 kbps (média) e 128 kbps (baixa).' },
              { icon: '🖼️', title: 'Download de Thumbnails', kw: 'capa miniatura', desc: 'Formatos PNG e JPG. Resoluções: Máxima, Alta, Média e Padrão.' },
              { icon: '⚡', title: 'Preview em Tempo Real', desc: 'Veja thumbnail, título e duração do vídeo antes de baixar.' },
              { icon: '💬', title: 'Erros Explicados', desc: 'Vídeo privado, com restrição de idade, exclusivo para membros, removido por direitos autorais ou live que ainda não começou aparecem com mensagem clara.' },
            ],
            note: 'Os arquivos vão para a pasta <strong>Downloads</strong>, com nome único se já existir um igual. O YouTube passou a exigir um runtime JavaScript para liberar os formatos: o <strong>INSTALAR.py</strong> baixa o Deno automaticamente (Node, Bun ou QuickJS também servem). Se vídeos públicos aparecerem como “não disponíveis”, rode o instalador de novo ou o ATUALIZAR.py.',
          },
          {
            id: 'instasaver', icon: '📸', name: 'InstaSaver', subtitle: 'Stories, destaques e posts do Instagram', url: '/instasaver',
            badges: ['internet', 'login'],
            keywords: 'instagram insta ig stories highlights reel baixar download salvar perfil saveclip',
            desc: 'Cole o link de um story, destaque, post, reel ou perfil (ou só o @usuário) e o app mostra tudo do perfil dono do link: stories, destaques e posts, com download individual ou em ZIP.',
            features: [
              { icon: '🔗', title: 'Link Automático', desc: 'Reconhece links de story, destaque (inclusive o link curto /s/ compartilhado pelo app), post, reel ou perfil, e também um @usuário digitado. Tem botão “Colar” para usar a área de transferência.' },
              { icon: '⏱️', title: 'Stories', desc: 'Stories das últimas 24h do perfil, com botão para baixar todos em .zip.' },
              { icon: '⭐', title: 'Destaques', desc: 'Abra qualquer destaque do perfil e baixe-o inteiro em .zip.' },
              { icon: '🖼️', title: 'Posts e Reels', desc: 'Grade de posts e reels com “Carregar mais” e download de todos os carregados em .zip.' },
              { icon: '👤', title: 'Foto de Perfil', desc: 'Baixe a foto de perfil ou abra o perfil direto no Instagram.' },
              { icon: '🔍', title: 'Visualizador', desc: 'Abra fotos e vídeos em tela cheia e navegue entre eles pelas setas ‹ ›, baixando um a um.' },
            ],
            note: 'Os downloads continuam indo para a pasta <strong>Downloads</strong>; com o Verto ligado, as <strong>Automações</strong> levam cada um para <strong>Documentos/Instagram/&lt;Perfil&gt;</strong>, separado em Stories, Destaques, Posts e Reels (ZIPs são abertos sozinhos). É preciso estar <strong>logado no Instagram em um navegador desta máquina</strong> (Chrome, Firefox, Chromium, Brave, Edge, Opera ou Vivaldi): o app reaproveita essa sessão e só mostra o que a sua conta já pode ver. Para escolher o navegador, defina a variável <strong>INSTASAVER_BROWSER</strong>; para usar um cookies.txt exportado, defina <strong>INSTASAVER_COOKIES</strong>. No Linux, ler a sessão do Chrome exige o pacote secretstorage (já está no requirements.txt).',
          },
          {
            id: 'vscosaver', icon: '🎞️', name: 'VscoSaver', subtitle: 'Galeria, coleção e spaces do VSCO', url: '/vscosaver',

            keywords: 'vsco vsco.co galeria gallery colecao collection repost spaces foto video baixar download salvar perfil preset filtro',
            desc: 'Cole o link de um perfil, foto, vídeo, coleção ou space do VSCO (ou só o nome do usuário) e o app mostra tudo do perfil dono do link: galeria, coleção e spaces, com download individual ou em ZIP.',
            features: [
              { icon: '🔗', title: 'Link Automático', desc: 'Reconhece links de perfil (vsco.co/usuario/gallery), foto (/media/), vídeo (/video/), coleção (/collection/), spaces e o endereço antigo usuario.vsco.co, e também um nome de usuário digitado. Tem botão “Colar” para usar a área de transferência.' },

              { icon: '👤', title: 'Foto de Perfil', desc: 'Baixe a foto de perfil em tamanho original ou abra o perfil direto no VSCO.' },

            note: 'Não precisa de login: o VSCO é público. O app usa o pacote <strong>curl_cffi</strong> (já está no requirements.txt) porque o VSCO bloqueia requisições que não parecem vir de um navegador, e o <strong>FFmpeg</strong> para montar os vídeos. Se aparecer “O VSCO limitou as requisições”, espere um ou dois minutos antes de buscar de novo.',

          {
            id: 'whatssaver', icon: '💬', name: 'WhatsSaver', subtitle: 'Fotos e vídeos das conversas do WhatsApp', url: '/whatssaver',

            keywords: 'whatsapp zap wpp conversa chat contato grupo foto video midia arquivo documento baixar download salvar backup exportar galeria heic',
            desc: 'Conecte o seu WhatsApp (como no WhatsApp Web), escolha uma conversa e veja todas as fotos e vídeos dela — inclusive os enviados como arquivo/documento — com download direto dos servidores do WhatsApp, mesmo do que o celular nunca baixou.',
            features: [
              { icon: '🔗', title: 'Conexão por QR ou Código', kw: 'aparelho conectado whatsapp web parear', desc: 'Escaneie o QR em “Aparelhos conectados” no celular ou gere um código de 8 dígitos pelo número de telefone. O app entra como o aparelho “LocalTools WhatsSaver” e só lê: não envia nada.' },
              { icon: '💬', title: 'Conversas com Mídia', desc: 'Conversas e grupos com a contagem de fotos, vídeos e arquivos de cada um, busca por nome ou número e foto de perfil.' },
              { icon: '📎', title: 'Enviados como Arquivo', kw: 'documento heic original qualidade', desc: 'Fotos e vídeos mandados como documento (para manter a qualidade original) aparecem junto, com o nome original — mesmo que o celular nunca tenha baixado.' },
              { icon: '⬇️', title: 'Baixe Só o Que Quiser', desc: 'Clicar numa mídia só abre para ver. O botão ⬇ (no card ou no visualizador) baixa pelo navegador, um por um; “Baixar tudo” ou uma seleção (Shift para intervalos) gera um .zip, com a data de cada mensagem no nome dos arquivos.' },
              { icon: '🕰️', title: 'Mensagens Antigas', kw: 'historico sincronizar', desc: 'Ao conectar, o celular manda só o histórico recente; ao abrir uma conversa, o app pede sozinho ao celular, em lotes, o resto dela até o começo, e as fotos e vídeos antigos vão aparecendo no fim da grade.' },
              { icon: '♻️', title: 'Arquivos Conferidos', kw: 'reenvio reupload corrompido bad decrypt', desc: 'Cada arquivo é conferido pela chave da mensagem antes de ser entregue. Se o servidor do WhatsApp não tiver mais o original (ou devolver outro conteúdo), o app pede ao celular para reenviá-lo, como o WhatsApp Web faz — nada chega corrompido.' },

    // ---------- Busca ----------
    // A comparação ignora acentos e maiúsculas: "audio" encontra "Áudio".
    const STOPWORDS = new Set(['de', 'da', 'do', 'das', 'dos', 'a', 'o', 'as', 'os', 'e', 'em', 'no', 'na', 'nos', 'nas',
      'um', 'uma', 'para', 'pra', 'com', 'por', 'que', 'como', 'meu', 'minha']);

    function fold(text) {
      return String(text).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
    }

    function stripTags(html) {
      return String(html).replace(/<[^>]+>/g, '');
    }

    // Plural simples do português: "imagem" e "imagens" se acham, "funções"
    // acha "função", "legendas" acha "legenda".
    function variants(term) {
      const list = [term];
      if (term.length > 3) {
        if (term.endsWith('ns')) list.push(term.slice(0, -2) + 'm');
        if (term.endsWith('m')) list.push(term.slice(0, -1) + 'ns');
        if (term.endsWith('oes') || term.endsWith('aes')) list.push(term.slice(0, -3) + 'ao');
        if (term.endsWith('s')) list.push(term.slice(0, -1));
      }
      return list;
    }

    // Cada termo vira uma regex sobre o texto sem acento. Termos de até 2 letras
    // ("ia", "js", "3d") só casam com a palavra inteira, senão "ia" acharia
    // "mídia", "via", "cópia"...
    function termsOf(query) {
      const all = fold(query).split(/\s+/).filter(Boolean);
      const useful = all.filter(t => !STOPWORDS.has(t));
      return (useful.length ? useful : all).map(term => {
        const alternatives = variants(term).map(v => v.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|');
        const source = term.length <= 2 ? `\\b(?:${alternatives})\\b` : `(?:${alternatives})`;
        return { test: new RegExp(source), scan: new RegExp(source, 'g') };
      });
    }

    function has(text, term) {
      return term.test.test(text);
    }

    function escapeHtml(text) {
      return String(text).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    }

    // Destaca os termos no texto original. Cada caractere é "dobrado" isoladamente,
    // mantendo um mapa de posição para realçar a palavra com acento correta.
    function highlight(text, terms) {
      if (!terms.length) return escapeHtml(text);
      let folded = '';
      const map = [];
      for (let i = 0; i < text.length; i++) {
        const f = fold(text[i]);
        for (let k = 0; k < f.length; k++) { folded += f[k]; map.push(i); }
      }
      const marked = new Array(text.length).fill(false);
      for (const term of terms) {
        term.scan.lastIndex = 0;
        let m;
        while ((m = term.scan.exec(folded)) !== null) {
          if (!m[0].length) { term.scan.lastIndex++; continue; }
          for (let j = m.index; j < m.index + m[0].length; j++) marked[map[j]] = true;
        }
      }
      let out = '';
      let open = false;
      for (let i = 0; i < text.length; i++) {
        if (marked[i] && !open) { out += '<mark>'; open = true; }
        if (!marked[i] && open) { out += '</mark>'; open = false; }
        out += escapeHtml(text[i]);
      }
      return open ? out + '</mark>' : out;
    }

    // Igual ao highlight, mas preserva as tags <strong> que existem nas notas.
    function highlightHtml(html, terms) {
      return html.split(/(<[^>]+>)/).map(part => part.startsWith('<') ? part : highlight(part, terms)).join('');
    }

    // Pré-calcula o texto pesquisável de cada app e função ("kw" são sinônimos
    // de uma função específica, que não aparecem na tela).
    let TOTAL_APPS = 0;
    for (const cat of CATEGORIAS) {
      for (const app of cat.apps) {
        TOTAL_APPS++;
        app.nameText = fold([app.name, app.subtitle, app.keywords || ''].join(' '));
        app.ctxText = fold([app.desc, stripTags(app.note || ''), (app.badges || []).map(b => BADGES[b]).join(' ')].join(' '));
        for (const f of app.features) f.text = fold([f.title || '', f.desc, f.kw || ''].join(' '));
        for (const u of app.usos || []) u.text = fold(u.desc);
      }
    }

    // Decide o que mostrar de um app para a busca atual:
    //  - todos os termos batem com nome/subtítulo/palavras-chave: app inteiro;
    //  - senão, os termos que sobram precisam estar na função (ou na descrição
    //    do app), e pelo menos um deles na própria função. Assim "pdf senha"
    //    mostra só Proteger e Desbloquear, não as 12 ferramentas de PDF;
    //  - se só a descrição do app bate, mostra o app com as funções recolhidas.
    function matchApp(app, terms) {
      const total = app.features.length + (app.usos || []).length;
      const specific = terms.filter(t => !has(app.nameText, t));
      if (!specific.length) {
        return { features: app.features, usos: app.usos || [], hidden: 0 };
      }
      const hit = item => specific.some(t => has(item.text, t)) &&
        specific.every(t => has(item.text, t) || has(app.ctxText, t));
      const features = app.features.filter(hit);
      const usos = (app.usos || []).filter(hit);
      if (features.length || usos.length) {
        return { features, usos, hidden: total - features.length - usos.length };
      }
      if (specific.every(t => has(app.ctxText, t))) {
        return { features: [], usos: [], hidden: total };
      }
      return null;
    }

    // ---------- Renderização ----------
    const EXEMPLOS = ['legenda', 'senha pdf', 'remover fundo', 'mp3', 'instagram', 'docx'];

      aiguard: 'detective', clean: 'book-open', devdata: 'brackets-curly', qrcode: 'qr-code',
      encurtador: 'link-simple', tempo: 'clock',
    };
    const ICONE_CAT = {
      downloads: 'download-simple', audio: 'waveform', imagem: 'paint-brush', documentos: 'file-doc',
      conversao: 'arrows-clockwise', privacidade: 'fingerprint', texto: 'book-open', dev: 'brackets-curly',

    const tecla = (icone, cat, cls = '') =>
      `<span class="lt-key ${cls}" style="--hue: var(--lt-cat-${cat})"><svg class="lt-icon" aria-hidden="true"><use href="/static/localtools/icons.svg#${icone}"/></svg></span>`;

    function renderFeature(f, terms) {
      const inner = `
        <div class="feature-icon">${f.icon}</div>
        <div class="feature-text">
          ${f.title ? `<div class="feature-title">${highlight(f.title, terms)}</div>` : ''}
          <div class="feature-desc">${highlight(f.desc, terms)}</div>
        </div>`;
      return f.url
        ? `<a class="feature" href="${f.url}" title="Abrir ${escapeHtml(f.title)}">${inner}<span class="feature-go">↗</span></a>`
        : `<div class="feature">${inner}</div>`;
    }

    function renderApp(app, match, terms, cat) {
      const expanded = state.expanded.has(app.id);
      const features = expanded ? app.features : match.features;
      const usos = expanded ? (app.usos || []) : match.usos;
      const total = app.features.length + (app.usos || []).length;
      const badges = (app.badges || []).map(b => `<span class="badge badge-${b}">${BADGES[b]}</span>`).join('');
      return `
        <article class="app-section" id="app-${app.id}" style="--hue: var(--lt-cat-${cat})">
          <div class="app-header">
            ${ICONE_APP[app.id] ? `<span class="lt-key" style="--hue: var(--lt-cat-${cat})"><img src="/static/localtools/apps/${app.id}.webp" alt="" width="56" height="56" loading="lazy"></span>` : `<div class="app-icon">${app.icon}</div>`}
            <div class="app-heading">
              <h3 class="app-title">${highlight(app.name, terms)}</h3>
              <div class="app-subtitle">${highlight(app.subtitle, terms)}</div>
            </div>
            <a class="open-app lt-btn" href="${app.url}">Abrir app
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </a>
          </div>
          ${badges ? `<div class="badges">${badges}</div>` : ''}
          <p class="app-description">${highlight(app.desc, terms)}</p>
          ${features.length ? `<div class="features">${features.map(f => renderFeature(f, terms)).join('')}</div>` : ''}
          ${usos.length ? `
            <div class="sub-section">

          ${match.hidden && !expanded ? `<button type="button" class="show-all" data-app="${app.id}">${match.hidden === total
            ? `Mostrar as ${total} funções`
            : `Mostrar todas as ${total} funções (${total - match.hidden} ${total - match.hidden === 1 ? 'encontrada' : 'encontradas'})`}</button>` : ''}
        </article>`;
    }

    function render() {
      const terms = termsOf(state.query);
      const perCat = {};
      let found = 0;
      let html = '';

      for (const cat of CATEGORIAS) {
        const shown = [];
        for (const app of cat.apps) {
          const match = matchApp(app, terms);
          if (!match) continue;
          perCat[cat.id] = (perCat[cat.id] || 0) + 1;
          if (state.cat === 'todas' || state.cat === cat.id) shown.push(renderApp(app, match, terms, cat.id));
        }
        if (!shown.length) continue;
        found += shown.length;
        html += `
          <section class="category" id="cat-${cat.id}" style="--hue: var(--lt-cat-${cat.id})">
            <div class="category-header">
              ${tecla(ICONE_CAT[cat.id] || 'book-open', cat.id, 'sm')}
              <div>
                <h2 class="category-title">${escapeHtml(cat.name)}</h2>
                <p class="category-desc">${escapeHtml(cat.desc)}</p>
              </div>
              <span class="category-count">${shown.length} ${shown.length === 1 ? 'app' : 'apps'}</span>
            </div>
            ${shown.join('')}
          </section>`;
      }

      const allMatches = Object.values(perCat).reduce((a, b) => a + b, 0);
      renderChips(perCat, allMatches);

      const catName = state.cat === 'todas' ? '' : CATEGORIAS.find(c => c.id === state.cat).name;
      if (!terms.length) {
        $info.innerHTML = catName
          ? `Mostrando <strong>${found}</strong> ${found === 1 ? 'app' : 'apps'} de <strong>${escapeHtml(catName)}</strong>`
          : `<strong>${TOTAL_APPS}</strong> apps em <strong>${CATEGORIAS.length}</strong> categorias · experimente: ` +
            EXEMPLOS.map(q => `<button type="button" class="example" data-q="${q}">${q}</button>`).join(', ');
      } else if (found) {
        $info.innerHTML = `<strong>${found}</strong> ${found === 1 ? 'app encontrado' : 'apps encontrados'} para “${escapeHtml(state.query.trim())}”` +
          (catName ? ` em <strong>${escapeHtml(catName)}</strong>` : '');
      } else {
        $info.innerHTML = '';
      }

      if (!found) {
        const elsewhere = catName && allMatches
          ? `<p>Mas há <strong>${allMatches}</strong> ${allMatches === 1 ? 'resultado' : 'resultados'} em outras categorias.</p><button type="button" data-action="all-cats" class="lt-btn ghost">Ver todas as categorias</button>`
          : `<p>Tente outra palavra, um sinônimo ou o nome do formato (ex.: “mp3”, “docx”, “srt”).</p><button type="button" data-action="clear" class="lt-btn ghost">Limpar busca</button>`;
        html = `
          <div class="empty-state">
            ${tecla('detective', 'ajuda', 'lg')}
            <div class="empty-state-title">Nada encontrado para “${escapeHtml(state.query.trim())}”${catName ? ` em ${escapeHtml(catName)}` : ''}</div>
            ${elsewhere}
          </div>`;
      }
      $content.innerHTML = html;
      $box.classList.toggle('has-value', state.query.length > 0);
    }

    function renderChips(perCat, allMatches) {
      const searching = termsOf(state.query).length > 0;
      const chip = (id, icon, label, count) => `
        <button type="button" class="chip${state.cat === id ? ' active' : ''}${searching && !count ? ' no-results' : ''}" data-cat="${id}"
          style="--hue: var(--lt-cat-${id === 'todas' ? 'ajuda' : id})">
          <span class="lt-dot"></span>${escapeHtml(label)} <span class="chip-count">${count}</span>
        </button>`;
      $chips.innerHTML = chip('todas', '', 'Todas', searching ? allMatches : TOTAL_APPS) +
        CATEGORIAS.map(c => chip(c.id, c.icon, c.short, searching ? (perCat[c.id] || 0) : c.apps.length)).join('');
    }

    // Mantém busca e categoria na URL (ex.: /instructions?q=legenda) para dar
    // para compartilhar ou abrir um resultado direto.
    function syncUrl() {
      const params = new URLSearchParams();
      if (state.query.trim()) params.set('q', state.query.trim());
      if (state.cat !== 'todas') params.set('cat', state.cat);
      const qs = params.toString();
      history.replaceState(null, '', location.pathname + (qs ? '?' + qs : '') + location.hash);
    }

    function update() {
      state.expanded.clear();
      render();
      syncUrl();
    }

    $search.addEventListener('input', () => {
      state.query = $search.value;
      update();
    });

    document.getElementById('clear').addEventListener('click', e => {
      e.preventDefault();
      $search.value = '';
      state.query = '';
      update();
      $search.focus();
    });

    $info.addEventListener('click', e => {
      const example = e.target.closest('.example');
      if (!example) return;
      $search.value = state.query = example.dataset.q;
      update();
      $search.focus();
    });

    $chips.addEventListener('click', e => {
      const btn = e.target.closest('.chip');
      if (!btn) return;
      state.cat = btn.dataset.cat;
      update();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    $content.addEventListener('click', e => {
      const showAll = e.target.closest('.show-all');
      if (showAll) {
        state.expanded.add(showAll.dataset.app);
        render();
        return;
      }
      const action = e.target.closest('[data-action]');
      if (!action) return;
      if (action.dataset.action === 'all-cats') state.cat = 'todas';
      if (action.dataset.action === 'clear') { $search.value = ''; state.query = ''; }
      update();
    });

    document.addEventListener('keydown', e => {
      const typing = ['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName);
      if ((e.key === '/' && !typing) || (e.key.toLowerCase() === 'k' && (e.ctrlKey || e.metaKey))) {
        e.preventDefault();
        $search.focus();
        $search.select();
      } else if (e.key === 'Escape' && document.activeElement === $search) {
        $search.value = '';
        state.query = '';
        update();
        $search.blur();
      }
    });

    const params = new URLSearchParams(location.search);
    state.query = params.get('q') || '';
    state.cat = CATEGORIAS.some(c => c.id === params.get('cat')) ? params.get('cat') : 'todas';
    $search.value = state.query;
    render();
    if (location.hash) {
      const target = document.getElementById(decodeURIComponent(location.hash.slice(1)));
      if (target) target.scrollIntoView();
    }
  </script>
</body>
</html>
