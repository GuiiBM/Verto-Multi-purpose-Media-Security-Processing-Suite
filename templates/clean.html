<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clean Reader - Limpador de Distração</title>
  <meta name="theme-color" content="#0b0c0f">
  <link rel="icon" type="image/svg+xml" href="/static/localtools/verto.svg">
  <link rel="stylesheet" href="/static/localtools/base.css">
  <link rel="stylesheet" href="/static/localtools/app.css">
  <link rel="stylesheet" href="/static/localtools/modos/leitura.css">
</head>
<body class="lt-body modo-leitura">
  <div class="progresso" id="progresso" aria-hidden="true"><i></i></div>
  <a class="lt-back" href="/" title="Voltar ao menu" aria-label="Voltar ao menu">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M19 12H5M5 12L12 19M5 12L12 5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </a>
  <div class="topo"><a class="lt-brand" href="/"><span>LOCALTOOLS</span></a></div>
  <header class="lt-head modo-cab">
    <span class="lt-key lg" style="--hue: var(--lt-cat-texto)"><img src="/static/localtools/apps/clean.webp" alt="" width="76" height="76"></span>
    <h1 class="modo-titulo">Clean Reader</h1>
    <p class="modo-sub">Cole o link de um artigo e leia só o texto: sem anúncios, pop-ups nem rastreadores.</p>
  </header>

  <main class="leitor">
    <form class="barra" id="form" autocomplete="off">
      <svg class="barra-ic" viewBox="0 0 256 256" aria-hidden="true"><path d="M232,50H160a38,38,0,0,0-32,17.55A38,38,0,0,0,96,50H24a6,6,0,0,0-6,6V200a6,6,0,0,0,6,6H96a26,26,0,0,1,26,26,6,6,0,0,0,12,0,26,26,0,0,1,26-26h72a6,6,0,0,0,6-6V56A6,6,0,0,0,232,50ZM96,194H30V62H96a26,26,0,0,1,26,26V204.31A37.86,37.86,0,0,0,96,194Zm130,0H160a37.87,37.87,0,0,0-26,10.32V88a26,26,0,0,1,26-26h66Z"/></svg>
      <input type="url" id="url-input" placeholder="https://exemplo.com/um-artigo" aria-label="Link do artigo" required>
      <button type="submit" id="extract-btn">Ler artigo</button>
    </form>
    <div class="selos"><span>Sem anúncios</span><span>Sem pop-ups</span><span>Exporta PDF, Markdown e EPUB</span></div>
    <div class="status" id="status" role="status" aria-live="polite"></div>

    <!-- antes de abrir um artigo: uma página de exemplo, em branco -->
    <section class="vazio" id="vazio" aria-hidden="true">
      <div class="folha-modelo">
        <i class="l t"></i><i class="l t2"></i>
        <i class="l m"></i>
        <i class="l"></i><i class="l"></i><i class="l"></i><i class="l c"></i>
        <i class="l"></i><i class="l"></i><i class="l c2"></i>
      </div>
      <p>O artigo aparece aqui, como uma página de livro.</p>
    </section>

    <!-- artigo -->
    <article class="livro" id="livro" data-tema="sepia" hidden>
      <div class="ferramentas">
        <div class="fonte-info" id="fonte-info"></div>
        <div class="controles">
          <div class="grupo" role="group" aria-label="Tamanho do texto">
            <button type="button" class="ctl" id="menor" aria-label="Diminuir o texto">A<small>−</small></button>
            <button type="button" class="ctl" id="maior" aria-label="Aumentar o texto">A<small>+</small></button>
          </div>
          <div class="grupo temas" role="group" aria-label="Tom da página">
            <button type="button" class="ctl tema" data-t="sepia" aria-label="Sépia"><i></i></button>
            <button type="button" class="ctl tema" data-t="papel" aria-label="Papel"><i></i></button>
            <button type="button" class="ctl tema" data-t="noite" aria-label="Noite"><i></i></button>
          </div>
          <button type="button" class="ctl texto" id="foco">Modo foco</button>
          <div class="grupo exportar" role="group" aria-label="Exportar">
            <button type="button" class="ctl texto" data-fmt="pdf">PDF</button>
            <button type="button" class="ctl texto" data-fmt="markdown">Markdown</button>
            <button type="button" class="ctl texto" data-fmt="epub">EPUB</button>
          </div>
        </div>
      </div>
      <div class="pagina" id="pagina">
        <header class="pagina-cab">
          <div class="pagina-sobre" id="pagina-sobre"></div>
          <h2 class="pagina-titulo" id="content-title"></h2>
          <div class="ornamento" aria-hidden="true">⁂</div>
        </header>
        <div class="texto" id="content-body"></div>
        <div class="fim" aria-hidden="true">fim</div>
      </div>
    </article>
  </main>

  <button type="button" class="sair-foco" id="sair-foco" aria-label="Sair do modo foco">×</button>

  <script>
    const $ = (id) => document.getElementById(id);
    let atual = { title: '', content: '' };
    const guardado = (k, padrao) => { try { return localStorage.getItem('clean.' + k) || padrao; } catch { return padrao; } };
    const guardar = (k, v) => { try { localStorage.setItem('clean.' + k, v); } catch {} };

    function status(msg, tipo) {
      const s = $('status');
      s.textContent = msg || '';
      s.className = 'status' + (msg ? ' show' : '') + (tipo ? ' ' + tipo : '');
    }

    // links e imagens do artigo: endereço completo (o texto vem sem a página original)
    // e nada de javascript: nos links
    function arrumar(html, base) {
      const t = document.createElement('template');
      t.innerHTML = html;
      t.content.querySelectorAll('a[href]').forEach((a) => {
        try {
          const u = new URL(a.getAttribute('href'), base);
          if (!/^https?:$/.test(u.protocol)) { a.removeAttribute('href'); return; }
          a.href = u.href; a.target = '_blank'; a.rel = 'noopener noreferrer';
        } catch { a.removeAttribute('href'); }
      });
      t.content.querySelectorAll('img[src]').forEach((img) => {
        try { img.src = new URL(img.getAttribute('src'), base).href; } catch { img.remove(); return; }
        img.loading = 'lazy'; img.referrerPolicy = 'no-referrer';
        img.onerror = () => img.remove();
      });
      return t.innerHTML;
    }

    $('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const url = $('url-input').value.trim();
      if (!url) { status('Cole o link de um artigo.', 'error'); return; }
      const btn = $('extract-btn');
      btn.disabled = true; btn.textContent = 'Buscando…';
      status('');
      $('livro').hidden = true;
      $('vazio').hidden = false;
      $('vazio').classList.add('carregando');
      try {
        const r = await fetch('/clean/extract', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ url })
        });
        const d = await r.json();
        if (!d.success) throw new Error(d.error || 'Não foi possível abrir esse link.');
        atual = { title: d.title || 'Artigo', content: d.content };
        const palavras = (d.text || '').split(/\s+/).filter(Boolean).length;
        const minutos = Math.max(1, Math.round(palavras / 230));
        let host = '';
        try { host = new URL(d.url || url).hostname.replace(/^www\./, ''); } catch {}
        $('content-title').textContent = atual.title;
        $('content-body').innerHTML = arrumar(d.content, d.url || url);
        $('pagina-sobre').textContent = [host, `${minutos} min de leitura`].filter(Boolean).join('  ·  ');
        $('fonte-info').innerHTML = host ? `<span class="ponto" aria-hidden="true"></span>${host}` : '';
        $('vazio').hidden = true;
        $('livro').hidden = false;
        $('livro').scrollIntoView({ behavior: 'smooth', block: 'start' });
        atualizarProgresso();
      } catch (err) {
        status('Erro: ' + err.message, 'error');
      } finally {
        $('vazio').classList.remove('carregando');
        btn.disabled = false; btn.textContent = 'Ler artigo';
      }
    });

    // exportar
    document.querySelectorAll('[data-fmt]').forEach((b) => b.addEventListener('click', async () => {
      const fmt = b.dataset.fmt;
      status(`Exportando para ${fmt.toUpperCase()}…`);
      try {
        const r = await fetch('/clean/export', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ format: fmt, title: atual.title, content: atual.content })
        });
        const d = await r.json();
        if (!d.success) throw new Error(d.error);
        status(`${d.filename} salvo em Downloads`, 'success');
      } catch (err) { status('Erro ao exportar: ' + err.message, 'error'); }
    }));

    // tamanho do texto e tom da página (lembrados neste navegador)
    let tamanho = Number(guardado('tamanho', 21));
    function aplicarTamanho() {
      tamanho = Math.min(28, Math.max(16, tamanho));
      $('pagina').style.setProperty('--tam', tamanho + 'px');
      guardar('tamanho', tamanho);
    }
    $('menor').onclick = () => { tamanho -= 1; aplicarTamanho(); };
    $('maior').onclick = () => { tamanho += 1; aplicarTamanho(); };
    function aplicarTema(t) {
      $('livro').dataset.tema = t;
      document.querySelectorAll('.tema').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.t === t)));
      guardar('tema', t);
    }
    document.querySelectorAll('.tema').forEach((b) => b.onclick = () => aplicarTema(b.dataset.t));
    aplicarTamanho();
    aplicarTema(guardado('tema', 'sepia'));

    // modo foco: só a página, sem o resto do app (Esc sai)
    function foco(on) {
      document.body.classList.toggle('em-foco', on);
      if (on) $('livro').scrollIntoView({ block: 'start' });
    }
    $('foco').onclick = () => foco(true);
    $('sair-foco').onclick = () => foco(false);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') foco(false); });

    // barra de leitura no topo
    function atualizarProgresso() {
      const p = $('pagina'), barra = $('progresso');
      if ($('livro').hidden) { barra.classList.remove('on'); return; }
      const r = p.getBoundingClientRect();
      const total = r.height - innerHeight;
      const feito = total > 0 ? Math.min(1, Math.max(0, -r.top / total)) : (r.top < innerHeight ? 1 : 0);
      barra.classList.add('on');
      barra.firstElementChild.style.transform = `scaleX(${feito})`;
    }
    addEventListener('scroll', atualizarProgresso, { passive: true });
    addEventListener('resize', atualizarProgresso);
  </script>
</body>
</html>
